<title>The Blitz \u2014 Wright-Patt AFB Golf League</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<style>
:root, :root[data-theme="light"], :root[data-theme="dark"] {
  /* The Blitz — light mode locked */
  --bg: #c0cac7; --bg-alt: #b5c0bd; --bg-card: #ffffff;
  --text: #1a2e33; --text-muted: #5a7a7e; --text-dim: #97b0b4;
  --border: #dce8e4; --border-focus: #1a8a68;
  --accent: #1a8a68; --accent-hover: #15704a; --accent-light: #e6f5ef;
  --danger: #c0392b; --danger-light: #fce8e6;
  --warning: #d4860a; --warning-light: #fef5e0;
  --info: #1a7a82; --info-light: #e4f4f6;
  --header-bg: #0c3640; --header-text: #f0f8f4;
  --nav-bg: #0a2e38;
  --teal-900: #0c3640; --teal-800: #10505e; --teal-700: #186a78;
  --green-600: #1a8a68; --green-500: #22a67e; --green-400: #3ec9a0;
  --green-200: #b0ecd6; --green-100: #e6f5ef;
  color-scheme: light !important;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--header-bg); }
.mono { font-family: 'JetBrains Mono', monospace; font-size: 0.92em; }
input, select, button { font-family: inherit; }
input[type="number"]::-webkit-inner-spin-button { opacity: 1; }
.grad-accent { background: linear-gradient(135deg, #1a8a68 0%, #186a78 100%); }
.grad-header { background: linear-gradient(180deg, var(--teal-900) 0%, #081c24 100%); }
input.score-cell { width: 3.2rem; height: 2.75rem; text-align: center; border-radius: 8px;
  border: 2px solid #8a9e98; background: #fff; color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 700; }
input.score-cell:focus { border-color: var(--border-focus); outline: none; box-shadow: 0 0 0 3px rgba(26,138,104,0.2); }
/* Readable table defaults */
table.data-table th, table.data-table td { padding: 8px 12px; }
table.data-table th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
table.data-table tbody tr { border-bottom: 1px solid var(--border); }
table.data-table tbody tr:hover { background: rgba(26,138,104,0.03); }
.card-hover { transition: border-color 0.15s, box-shadow 0.15s; }
.card-hover:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(26,138,104,0.08); }
</style>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      bg: 'var(--bg)', 'bg-alt': 'var(--bg-alt)', 'bg-card': 'var(--bg-card)',
      txt: 'var(--text)', 'txt-m': 'var(--text-muted)', 'txt-d': 'var(--text-dim)',
      bdr: 'var(--border)', 'bdr-f': 'var(--border-focus)',
      acc: 'var(--accent)', 'acc-h': 'var(--accent-hover)', 'acc-l': 'var(--accent-light)',
      dng: 'var(--danger)', 'dng-l': 'var(--danger-light)',
      wrn: 'var(--warning)', 'wrn-l': 'var(--warning-light)',
      inf: 'var(--info)', 'inf-l': 'var(--info-light)',
      'hdr-bg': 'var(--header-bg)', 'hdr-txt': 'var(--header-text)',
      'nav-bg': 'var(--nav-bg)',
    }
  }}
};
</script>

// CALCULATION ENGINE — Pure functions, no side effects
// ═══════════════════════════════════════════════════════════════════

const BlitzEngine = (() => {

  // Handicap index calculation
  function calculateHandicapIndex(rounds, asOfDate, calcParams, winterStart, winterEnd) {
    if (!rounds || rounds.length === 0) return null;
    const eligible = rounds.filter(r => {
      const pd = new Date(r.playDate);
      if (pd >= new Date(asOfDate)) return false;
      const isWinter = isWinterDate(pd, winterStart, winterEnd);
      const asOf = new Date(asOfDate);
      const asOfIsWinter = isWinterDate(asOf, winterStart, winterEnd);
      if (isWinter && !asOfIsWinter) return false;
      return r.differential != null && !isNaN(r.differential);
    });
    eligible.sort((a, b) => new Date(b.playDate) - new Date(a.playDate));
    const recent = eligible.slice(0, 20);
    if (recent.length < 3) return null;
    const param = calcParams.find(p => recent.length >= p.minScores && recent.length <= p.maxScores);
    if (!param) return null;
    const sorted = [...recent].sort((a, b) => a.differential - b.differential);
    const best = sorted.slice(0, param.differentialsToUse);
    const avg = best.reduce((s, r) => s + r.differential, 0) / best.length;
    return Math.round((avg + param.adjustment) * 10) / 10;
  }

  function isWinterDate(date, startMD, endMD) {
    const m = date.getMonth() + 1, d = date.getDate();
    // Winter: Nov 15 - Mar 31
    if (m > startMD[0] || (m === startMD[0] && d >= startMD[1])) return true;
    if (m < endMD[0] || (m === endMD[0] && d <= endMD[1])) return true;
    return false;
  }

  function calculateDifferential(grossScore, courseRating, slope) {
    if (!slope || slope === 0) return null;
    return Math.round(((grossScore - courseRating) * 113 / slope) * 10) / 10;
  }

  function calculateCourseHandicap(playableIndex, slope, courseRating, par) {
    if (playableIndex == null) return null;
    return Math.round(playableIndex * (slope / 113) + (courseRating - par));
  }

  // Stroke allocation: which holes get strokes
  function allocateStrokes(courseHandicap, courseHoles) {
    const alloc = {};
    const sorted = [...courseHoles].sort((a, b) => a.strokeIndex - b.strokeIndex);
    const absHdcp = Math.abs(courseHandicap || 0);
    const isNeg = (courseHandicap || 0) < 0;
    if (isNeg) {
      // Negative handicap: give back strokes on highest-index holes
      const revSorted = [...courseHoles].sort((a, b) => b.strokeIndex - a.strokeIndex);
      for (let i = 0; i < 18; i++) {
        alloc[revSorted[i].holeNumber] = i < absHdcp ? -1 : 0;
      }
    } else {
      for (let i = 0; i < 18; i++) {
        const hole = sorted[i];
        let strokes = 0;
        if (i < absHdcp) strokes = 1;
        if (i + 18 < absHdcp) strokes = 2;
        if (i + 36 < absHdcp) strokes = 3;
        alloc[hole.holeNumber] = strokes;
      }
    }
    return alloc;
  }

  // Net score for a single hole
  function calculateNetScore(grossScore, strokesReceived) {
    return grossScore - strokesReceived;
  }

  // Team hole score: worst-positive-drop algorithm
  function calculateTeamHoleScore(contributions, countX, teamSizeY, zeroTieFlag) {
    const eligible = contributions.filter(c => c != null);
    if (eligible.length === 0) return null;
    const rawSum = eligible.reduce((s, v) => s + v, 0);
    if (countX >= teamSizeY || eligible.length <= countX) {
      // No drop needed (2-of-2, or fewer players than countX)
      let zeroTieBias = 0;
      if (zeroTieFlag) {
        const hasPositive = eligible.some(v => v > 0);
        const hasZero = eligible.some(v => v === 0);
        if (!hasPositive && hasZero) zeroTieBias = 0.5;
      }
      return rawSum - zeroTieBias;
    }
    // Drop worst positive
    const positives = eligible.filter(v => v > 0);
    let worstPositive = 0;
    if (positives.length > 0) {
      worstPositive = Math.max(...positives);
    }
    let zeroTieBias = 0;
    if (zeroTieFlag && worstPositive === 0) {
      const hasZero = eligible.some(v => v === 0);
      if (hasZero) zeroTieBias = 0.5;
    }
    return rawSum - worstPositive - zeroTieBias;
  }

  // Skins: determine winner per hole
  function determineSkinWinner(holeScores, skinType) {
    // holeScores: [{playerRowId, gross, net, isPlaceholder, isTagger}]
    const eligible = holeScores.filter(s => !s.isPlaceholder && s[skinType] != null);
    if (eligible.length < 2) return null;
    const minScore = Math.min(...eligible.map(s => s[skinType]));
    const winners = eligible.filter(s => s[skinType] === minScore);
    if (winners.length === 1) return winners[0].playerRowId;
    return null; // tie = no winner
  }

  // Procto payouts: whole-dollar, remainder to last
  function calculateProctoPayouts(totalPool, activeHoleCount) {
    if (activeHoleCount === 0) return [];
    const perHole = Math.floor(totalPool / activeHoleCount);
    const remainder = totalPool - (perHole * activeHoleCount);
    const payouts = [];
    for (let i = 0; i < activeHoleCount; i++) {
      payouts.push(perHole + (i === activeHoleCount - 1 ? remainder : 0));
    }
    return payouts;
  }

  // Game payout lookup
  function lookupGamePayout(schedule, formatName, teamCount, bucket, finishPos) {
    return schedule.find(s =>
      s.formatName === formatName &&
      s.teamCount === teamCount &&
      s.scoreBucket === bucket &&
      s.finishPos === finishPos
    );
  }

  // Rank teams with tie handling (RANK.EQ behavior)
  function rankTeams(teams, scoreField) {
    const sorted = [...teams].filter(t => t[scoreField] != null)
      .sort((a, b) => a[scoreField] - b[scoreField]); // lower is better
    let rank = 1;
    for (let i = 0; i < sorted.length; i++) {
      if (i > 0 && sorted[i][scoreField] !== sorted[i - 1][scoreField]) {
        rank = i + 1;
      }
      sorted[i]._rank = rank;
      sorted[i]._tieCount = sorted.filter(t => t[scoreField] === sorted[i][scoreField]).length;
    }
    return sorted;
  }

  // Calculate team game winnings with tie-sharing via OccupiedPct
  function calculateTeamGameWinnings(rankedTeams, gamePool, teamCount, payoutSchedule, formatName) {
    const is6Plus = teamCount >= 6;
    const buckets = is6Plus ? ['Total'] : ['Front', 'Back', 'Total'];
    const results = {};

    buckets.forEach(bucket => {
      const field = bucket === 'Front' ? 'front9Score' : bucket === 'Back' ? 'back9Score' : 'total18Score';
      const ranked = rankTeams(rankedTeams, field);
      const bucketPool = is6Plus ? gamePool : gamePool / 3;

      ranked.forEach(team => {
        if (!results[team.teamNo]) results[team.teamNo] = { front: 0, back: 0, total: 0, sum: 0 };
        // Find matching schedule entries for tied positions
        const startPos = team._rank;
        const endPos = startPos + team._tieCount - 1;
        let totalPct = 0;
        for (let pos = startPos; pos <= endPos; pos++) {
          const entry = payoutSchedule.find(s =>
            s.formatName === formatName && s.teamCount === teamCount &&
            s.scoreBucket === bucket && s.finishPos === pos
          );
          if (entry) totalPct += entry.pctOfPool;
        }
        const sharedPct = totalPct / team._tieCount;
        const amount = bucketPool * sharedPct;
        const key = bucket.toLowerCase().replace('total', 'total');
        if (bucket === 'Front') results[team.teamNo].front += amount;
        else if (bucket === 'Back') results[team.teamNo].back += amount;
        else results[team.teamNo].total += amount;
        results[team.teamNo].sum = results[team.teamNo].front + results[team.teamNo].back + results[team.teamNo].total;
      });
    });
    return results;
  }

  // Skins per-skin value: whole dollars, kitty remainder
  function calculateSkinsPayouts(totalSkinsPool, totalSkinsWon) {
    if (totalSkinsWon === 0) return { perSkin: 0, kitty: totalSkinsPool };
    const perSkin = Math.floor(totalSkinsPool / totalSkinsWon);
    const kitty = totalSkinsPool - (perSkin * totalSkinsWon);
    return { perSkin, kitty };
  }

  return {
    calculateHandicapIndex, calculateDifferential, calculateCourseHandicap,
    allocateStrokes, calculateNetScore, calculateTeamHoleScore,
    determineSkinWinner, calculateProctoPayouts, lookupGamePayout,
    rankTeams, calculateTeamGameWinnings, calculateSkinsPayouts,
    isWinterDate
  };
})();

const DEFAULT_STATE = {
  schemaVersion: 1,
  players: [],
  courses: [],
  tees: [],
  courseHoles: [],
  playerTeeDefaults: [],
  gameFormats: [],
  payoutSchedule: [],
  handicapCalcParams: [],
  handicapRounds: [],
  playerIndexOverrides: [],
  currentRound: null,
  settings: {
    winterStart: [11, 15], winterEnd: [3, 31],
    defaultGameFee: 3, defaultSkinsFee: 2, defaultProctoFee: 1,
    useESC: false
  }
};

function loadState() {
  try {
    const raw = localStorage.getItem('blitz_data');
    if (raw) return { ...DEFAULT_STATE, ...JSON.parse(raw) };
  } catch (e) { console.error('Load failed:', e); }
  return { ...DEFAULT_STATE };
}

function saveState(state) {
  try {
    localStorage.setItem('blitz_data', JSON.stringify(state));
  } catch (e) { console.error('Save failed:', e); }
}

// Generate unique IDs
let _idCounter = Date.now();
function uid() { return (++_idCounter).toString(36); }

const AppCtx = createContext(null);

function useApp() { return useContext(AppCtx); }


// ═══════════════════════════════════════════════════════════════════
// UI COMPONENTS
// ═══════════════════════════════════════════════════════════════════

// --- Layout Shell ---
function App() {
  const [state, _setState] = useState(loadState);
  const [page, setPage] = useState('dashboard');
  const [toast, setToast] = useState(null);
  const [driveStatus, setDriveStatus] = useState('idle'); // idle | saving | saved | error
  const pendingRef = useRef(false);

  const setState = useCallback((updater) => {
    _setState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveState(next);
      pendingRef.current = true;
      return next;
    });
  }, []);

  // On load: check if we just returned from Google OAuth redirect
  useEffect(() => {
    const justAuthed = GoogleDrive.checkRedirectToken() || GoogleDrive.restoreToken();
    const pendingSync = sessionStorage.getItem('blitz_drive_pending_sync');
    if (justAuthed && pendingSync) {
      sessionStorage.removeItem('blitz_drive_pending_sync');
      (async () => {
        try {
          notify('Connected to Google Drive \u2014 syncing\u2026', 'success');
          await GoogleDrive.ensureFolder();
          const driveState = await GoogleDrive.loadState();
          if (driveState) {
            const localTime = state._lastSaved || 0;
            const driveTime = driveState._lastSaved || 0;
            if (driveTime > localTime) {
              if (confirm('Drive has newer data. Load it?')) {
                setState(s => ({ ...s, ...driveState }));
                notify('Loaded from Drive', 'success');
              } else {
                notify('Keeping local data', 'info');
              }
            } else {
              notify('Local data is current \u2014 connected', 'success');
            }
          } else {
            notify('Connected \u2014 no existing data on Drive yet', 'success');
          }
        } catch (err) {
          notify('Drive sync failed: ' + err.message, 'error');
          console.error('Auto-sync error:', err);
        }
      })();
    }
  }, []);

  // Auto-save to Google Drive every 2 minutes when changes are pending
  useEffect(() => {
    const timer = setInterval(async () => {
      if (!pendingRef.current) return;
      if (!GoogleDrive.isConnected()) return;
      try {
        setDriveStatus('saving');
        const saveData = { ...state, _lastSaved: Date.now() };
        await GoogleDrive.saveState(saveData);
        pendingRef.current = false;
        setDriveStatus('saved');
        setTimeout(() => setDriveStatus('idle'), 3000);
      } catch (e) {
        setDriveStatus('error');
        console.error('Auto-save failed:', e);
      }
    }, 120000); // 2 minutes
    return () => clearInterval(timer);
  }, [state]);

  const notify = useCallback((msg, type = 'info') => {
    setToast({ msg, type, id: uid() });
    setTimeout(() => setToast(null), 3000);
  }, []);

  const ctx = useMemo(() => ({ state, setState, page, setPage, notify, driveStatus }), [state, setState, page, notify, driveStatus]);

  return h(AppCtx.Provider, { value: ctx },
    h('div', { className: 'flex flex-col h-full' },
      h(Header),
      h('main', { className: 'flex-1 overflow-auto pb-20' },
        page === 'dashboard' && h(Dashboard),
        page === 'players' && h(PlayersPage),
        page === 'round-setup' && h(RoundSetupPage),
        page === 'teams' && h(TeamBuilderPage),
        page === 'scores' && h(ScoreEntryPage),
        page === 'results' && h(ResultsPage),
        page === 'handicaps' && h(HandicapPage),
        page === 'courses' && h(CoursesPage),
        page === 'finalize' && h(FinalizePage),
        page === 'tee-defaults' && h(TeeDefaultsPage),
        page === 'payout-schedule' && h(PayoutSchedulePage),
        page === 'snapshot' && h(SnapshotPage),
        page === 'history' && h(HistoryPage),
        page === 'settings' && h(SettingsPage),
      ),
      h(BottomNav),
      toast && h(Toast, { ...toast }),
    )
  );
}

function PlayersPage() {
  const { state, setState, notify, setPage } = useApp();
  const [search, setSearch] = useState('');
  const [showAdd, setShowAdd] = useState(false);
  const [editId, setEditId] = useState(null);
  const [showInactive, setShowInactive] = useState(false);

  const filtered = useMemo(() => {
    return state.players
      .filter(p => showInactive || p.active)
      .filter(p => !search || p.displayName.toLowerCase().includes(search.toLowerCase()))
      .sort((a, b) => a.displayName.localeCompare(b.displayName));
  }, [state.players, search, showInactive]);

  function addPlayer(name) {
    if (!name.trim()) return;
    const maxId = state.players.reduce((m, p) => Math.max(m, p.playerId), 0);
    setState(s => ({
      ...s,
      players: [...s.players, {
        playerId: maxId + 1,
        displayName: name.trim(),
        active: true,
        statusDate: new Date().toISOString().split('T')[0],
        notes: ''
      }]
    }));
    notify('Player added', 'success');
    setShowAdd(false);
  }

  function toggleActive(playerId) {
    setState(s => ({
      ...s,
      players: s.players.map(p => p.playerId === playerId ? { ...p, active: !p.active } : p)
    }));
  }

  // Calculate current handicap for display
  function getPlayerHandicap(playerId) {
    const rounds = state.handicapRounds.filter(r => r.playerId === playerId);
    if (rounds.length < 3) return null;
    const idx = BlitzEngine.calculateHandicapIndex(
      rounds, new Date().toISOString(),
      state.handicapCalcParams, state.settings.winterStart, state.settings.winterEnd
    );
    return idx;
  }

  return h('div', { className: 'max-w-[1400px] mx-auto px-6 py-4 space-y-4' },
    // Search + controls
    h('div', { className: 'flex gap-2' },
      h('input', {
        type: 'text', placeholder: 'Search players\u2026',
        value: search, onChange: e => setSearch(e.target.value),
        className: 'flex-1 px-3 py-2 rounded-lg border border-bdr bg-bg text-txt text-sm'
      }),
      h(Btn, { onClick: () => setShowAdd(true) }, '+ Add'),
    ),

    h('div', { className: 'flex items-center gap-2 text-sm' },
      h('label', { className: 'flex items-center gap-1.5 text-txt-m cursor-pointer' },
        h('input', { type: 'checkbox', checked: showInactive, onChange: () => setShowInactive(!showInactive) }),
        'Show inactive'
      ),
      h('span', { className: 'text-txt-d' }, `${filtered.length} player${filtered.length !== 1 ? 's' : ''}`),
    ),

    // Player list
    h('div', { className: 'space-y-1' },
      filtered.map(p => {
        const hdcp = getPlayerHandicap(p.playerId);
        const roundCount = state.handicapRounds.filter(r => r.playerId === p.playerId).length;
        return h('div', {
          key: p.playerId,
          className: `flex items-center justify-between py-2.5 px-3 rounded-lg border border-transparent hover:border-bdr hover:bg-bg-alt transition-colors ${!p.active ? 'opacity-50' : ''}`
        },
          h('div', { className: 'flex-1 min-w-0' },
            h('div', { className: 'font-medium text-sm truncate' }, p.displayName),
            h('div', { className: 'text-xs text-txt-m' },
              roundCount, ' rounds',
              !p.active && ' \u2022 Inactive'
            ),
          ),
          h('div', { className: 'flex items-center gap-3' },
            hdcp != null && h('span', { className: 'mono text-sm font-medium text-acc' }, hdcp.toFixed(1)),
            h('button', {
              onClick: () => toggleActive(p.playerId),
              className: 'text-xs text-txt-m hover:text-txt'
            }, p.active ? 'Deactivate' : 'Activate'),
          ),
        );
      })
    ),

    // Add player modal
    showAdd && h(AddPlayerModal, { onAdd: addPlayer, onClose: () => setShowAdd(false) }),
  );
}

function AddPlayerModal({ onAdd, onClose }) {
  const [name, setName] = useState('');
  return h('div', { className: 'fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4' },

      formatCode: state.gameFormats[0]?.formatCode || 'B23',
      playersPerTeam: 3,
      flightMode: 'ABC',
      unevenPlayerMode: 'Draw Score',
      gameFee: state.settings.defaultGameFee,
      skinsFee: state.settings.defaultSkinsFee,
      proctoFee: state.settings.defaultProctoFee,
      status: 'DRAFT',

    };

            )
          : h(Btn, { onClick: createRound }, 'Create New Round'),
      )
    );
  }

  return h(RoundSetupForm);
}

function RoundSetupForm() {
  const { state, setState, notify, setPage } = useApp();
  const cr = state.currentRound;

  function updateRound(patch) {
    setState(s => ({ ...s, currentRound: { ...s.currentRound, ...patch } }));
  }

  function setCourse(courseId) {
    const course = state.courses.find(c => c.courseId === courseId);
    updateRound({ courseId, courseName: course?.courseName || '' });
  }

  function setFormat(formatCode) {
    const fmt = state.gameFormats.find(f => f.formatCode === formatCode);
    if (fmt) updateRound({
      formatCode, gameFormat: fmt.formatName,
      playersPerTeam: fmt.teamSizeY || 3
    });
  }

  function togglePresent(playerId) {
    const existing = cr.participants.find(p => p.playerId === playerId);
    if (existing) {
      updateRound({ participants: cr.participants.filter(p => p.playerId !== playerId) });
    } else {
      const player = state.players.find(p => p.playerId === playerId);
      // Look up default tee + calculate course handicap
      const dflt = state.playerTeeDefaults.find(d => d.playerId === playerId && d.courseId === cr.courseId);
      const teeName = dflt?.teeDefault || state.tees.find(t => t.courseId === cr.courseId)?.teeName || '';
      const tee = state.tees.find(t => t.courseId === cr.courseId && t.teeName === teeName);
      
      // Get handicap index
      const rounds = state.handicapRounds.filter(r => r.playerId === playerId);
      const playableIndex = BlitzEngine.calculateHandicapIndex(
        rounds, cr.roundDate, state.handicapCalcParams,
        state.settings.winterStart, state.settings.winterEnd
      );
      const courseHdcp = tee ? BlitzEngine.calculateCourseHandicap(
        playableIndex, tee.slopeRating, tee.courseRating, tee.par
      ) : null;

      updateRound({
        participants: [...cr.participants, {
          playerId,
          playerName: player.displayName,
          playerRowId: `${cr.roundId}|${playerId}`,
          type: 'REAL_TEAM_PLAYER',
          present: true,
          tagger: false,
          preselectedTeam: null,
          selectedTee: teeName,
          playableIndex,
          courseHandicap: courseHdcp,
          flight: null,
          teamNo: null,
          teamSlot: null,
          eligibleForGame: true,
          eligibleForSkins: true,
          eligibleForProctos: true,
        }]
      });
    }
  }

  function toggleTagger(playerId) {
    updateRound({
      participants: cr.participants.map(p =>
        p.playerId === playerId ? {
          ...p,
          tagger: !p.tagger,
          type: !p.tagger ? 'REAL_TAGGER' : 'REAL_TEAM_PLAYER',
          eligibleForGame: p.tagger, // flip: was tagger, now player
        } : p
      )
    });
  }

  const activePlayers = state.players.filter(p => p.active).sort((a, b) => a.displayName.localeCompare(b.displayName));
  const presentCount = cr.participants.filter(p => p.present).length;
  const taggerCount = cr.participants.filter(p => p.tagger).length;
  const preselectedCount = cr.participants.filter(p => p.preselectedTeam && !p.tagger).length;
  const teamPlayerCount = presentCount - taggerCount;

  return h('div', { className: 'max-w-[1400px] mx-auto px-6 py-4 space-y-4' },
    // Round config
    h(Card, { className: 'space-y-3' },
      h('div', { className: 'grid grid-cols-2 gap-3' },
        h(Input, { label: 'Date', type: 'date', value: cr.roundDate,
          onChange: e => updateRound({ roundDate: e.target.value }) }),
        state.courses.length > 0 && h(Select, {
          label: 'Course', value: cr.courseId,
          onChange: e => setCourse(e.target.value),
          options: state.courses.map(c => ({ value: c.courseId, label: c.courseName }))
        }),
      ),
      h('div', { className: 'grid grid-cols-2 gap-3' },
        state.gameFormats.length > 0 && h(Select, {
          label: 'Format', value: cr.formatCode,
          onChange: e => setFormat(e.target.value),
          options: state.gameFormats.map(f => ({ value: f.formatCode, label: f.formatName }))
        }),
        h(Select, {
          label: 'Uneven Players', value: cr.unevenPlayerMode,
          onChange: e => updateRound({ unevenPlayerMode: e.target.value }),
          options: [{ value: 'Draw Score', label: 'Draw Score' }, { value: 'Taggers', label: 'Taggers' }]
        }),
      ),

// ═══════════════════════════════════════════════════════════════════
// TEAM BUILDER PAGE
// ═══════════════════════════════════════════════════════════════════

function TeamBuilderPage() {
  const { state, setState, notify, setPage } = useApp();
  const cr = state.currentRound;

  if (!cr) return h('div', { className: 'p-4 text-center text-txt-m' }, 'No active round. ', h('button', { onClick: () => setPage('round-setup'), className: 'text-acc underline' }, 'Start one'));

  const realPlayers = cr.participants.filter(p => !p.tagger && p.type !== 'DRAW_PLACEHOLDER');
  const taggers = cr.participants.filter(p => p.tagger);
  const ppt = cr.playersPerTeam || 3;
  // Draw mode: round UP so short teams get draw players. Tagger mode: round DOWN, leftovers become taggers.
  const teamCount = cr.unevenPlayerMode === 'Draw Score'
    ? Math.ceil(realPlayers.length / ppt)
    : Math.floor(realPlayers.length / ppt);
  const leftovers = realPlayers.length - (teamCount * ppt); // negative in draw mode = slots needing draws

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateTeams() {
    if (realPlayers.length < ppt) { notify('Not enough players for a team', 'error'); return; }

    // 1. Sort by handicap index for flight assignment
    const sorted = [...realPlayers].sort((a, b) => (a.playableIndex || 999) - (b.playableIndex || 999));
    const flights = ['A', 'B', 'C', 'D', 'E', 'F'].slice(0, ppt);
    const withFlights = sorted.map((p, i) => ({ ...p, flight: flights[i % flights.length] }));

    // 2. First pass: honor preselected team assignments (matching VBA)
    const preselected = withFlights.filter(p => p.preselectedTeam >= 1 && p.preselectedTeam <= teamCount);
    const unassigned = withFlights.filter(p => !preselected.includes(p));

    const teams = [];
    for (let t = 0; t < teamCount; t++) { teams.push({ teamNo: t + 1, members: [] }); }

    // Place preselected players first
    preselected.forEach(p => {
      const team = teams.find(t => t.teamNo === p.preselectedTeam);
      if (team && team.members.length < ppt) {
        const slot = flights[team.members.length] || flights[0];
        team.members.push({ ...p, teamNo: team.teamNo, teamSlot: slot });
      }
    });

    // 3. Shuffle unassigned within each flight, then fill remaining spots
    const byFlight = {};
    flights.forEach(f => { byFlight[f] = shuffle(unassigned.filter(p => p.flight === f)); });

    // Fill each team to capacity, one flight at a time, respecting flight diversity
    flights.forEach(f => {
      const teamOrder = shuffle(Array.from({ length: teamCount }, (_, i) => i));
      for (const candidate of byFlight[f]) {
        // Find a team that doesn't already have this flight and isn't full
        let placed = false;
        for (const ti of teamOrder) {
          const team = teams[ti];
          if (team.members.length >= ppt) continue;
          if (team.members.some(m => m.flight === f)) continue;
          const slot = flights[team.members.length] || flights[0];
          team.members.push({ ...candidate, teamNo: team.teamNo, teamSlot: slot });
          placed = true; break;
        }
        // Fallback: any team with room
        if (!placed) {
          for (const ti of teamOrder) {
            const team = teams[ti];
            if (team.members.length >= ppt) continue;
            const slot = flights[team.members.length] || flights[0];
            team.members.push({ ...candidate, teamNo: team.teamNo, teamSlot: slot });
            placed = true; break;
          }
        }
      }
    });

    // Re-sort slots within each team by rank
    teams.forEach(team => {
      team.members.sort((a, b) => (a.playableIndex || 999) - (b.playableIndex || 999));
      team.members.forEach((m, i) => { m.teamSlot = flights[i] || flights[0]; });
    });

    // 4. Handle leftovers: convert to taggers
    const assignedIds = new Set(teams.flatMap(t => t.members.map(m => m.playerId)));

    // 5. Draw player assignment (matches VBA AssignDrawPlayersFromRoundPlayerData)
    // For uneven teams: each team needing a player gets a draw placeholder
    // The draw player is randomly selected from same-flight real players on OTHER teams
    const drawAssignments = [];
    if (cr.unevenPlayerMode === 'Draw Score') {
      teams.forEach(team => {
        if (team.members.length < ppt) {
          // This team is short — add draw placeholders for missing flights
          const presentFlights = new Set(team.members.map(m => m.flight));
          flights.forEach(f => {
            if (!presentFlights.has(f)) {
              // Find candidates: same flight, assigned, on OTHER teams, not placeholder
              const candidates = teams
                .filter(t => t.teamNo !== team.teamNo)
                .flatMap(t => t.members)
                .filter(m => m.flight === f);
              const pick = candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : null;
              if (pick) {
                drawAssignments.push({
                  teamNo: team.teamNo,
                  placeholderFlight: f,
                  drawnPlayerId: pick.playerId,
                  drawnPlayerName: pick.playerName,
                });
              }
            }
          });
        }
      });
    }

    // 6. Build updated participants
    const updatedParticipants = cr.participants
      .filter(p => p.type !== 'DRAW_PLACEHOLDER') // Remove old placeholders
      .map(p => {
        for (const team of teams) {
          const member = team.members.find(m => m.playerId === p.playerId);
          if (member) return { ...p, ...member, type: 'REAL_TEAM_PLAYER' };
        }
        if (!p.tagger && !assignedIds.has(p.playerId)) {
          return { ...p, teamNo: null, teamSlot: null, type: 'REAL_TAGGER', tagger: true };
        }
        return p;
      });

    // 7. Add draw placeholders as synthetic participants
    drawAssignments.forEach(da => {
      updatedParticipants.push({
        playerId: -da.teamNo * 100 - da.placeholderFlight.charCodeAt(0),
        playerName: `Draw: ${da.drawnPlayerName}`,
        playerRowId: `draw|${da.teamNo}|${da.placeholderFlight}`,
        type: 'DRAW_PLACEHOLDER',
        present: true, tagger: false,
        teamNo: da.teamNo,
        teamSlot: da.placeholderFlight,
        flight: da.placeholderFlight,
        drawnFromPlayerId: da.drawnPlayerId,
        courseHandicap: cr.participants.find(p => p.playerId === da.drawnPlayerId)?.courseHandicap,
        playableIndex: cr.participants.find(p => p.playerId === da.drawnPlayerId)?.playableIndex,
        selectedTee: cr.participants.find(p => p.playerId === da.drawnPlayerId)?.selectedTee,
        eligibleForGame: true, eligibleForSkins: false, eligibleForProctos: false,
      });
    });

    setState(s => ({
      ...s,
      currentRound: {
        ...s.currentRound,
        participants: updatedParticipants,
        teams: teams.map(t => ({ teamNo: t.teamNo, memberIds: t.members.map(m => m.playerId) })),
        drawAssignments,
        status: 'TEAMS_ASSIGNED',
      }
    }));
    const drawMsg = drawAssignments.length > 0 ? `, ${drawAssignments.length} draw(s)` : '';
    notify(`${teamCount} teams generated${drawMsg}`, 'success');
  }

  // Group participants by team
  const teamGroups = {};
  cr.participants.filter(p => p.teamNo).forEach(p => {
    if (!teamGroups[p.teamNo]) teamGroups[p.teamNo] = [];
    teamGroups[p.teamNo].push(p);
  });
  const unassigned = cr.participants.filter(p => !p.teamNo && !p.tagger && p.present && p.type !== 'DRAW_PLACEHOLDER');

  return h('div', { className: 'max-w-[1400px] mx-auto px-6 py-4 space-y-4' },
    h('div', { className: 'flex justify-between items-center' },
      h('div', null,
        h('div', { className: 'text-sm text-txt-m' },
          `${realPlayers.length} team players \u2022 ${ppt}/team \u2022 ${teamCount} teams`,
          leftovers > 0 && ` \u2022 ${leftovers} leftover`,
          (cr.drawAssignments || []).length > 0 && ` \u2022 ${cr.drawAssignments.length} draw(s)`
        ),
      ),
      h('div', { className: 'flex gap-2' },
        h(Btn, { variant: 'secondary', onClick: generateTeams },
          cr.teams.length > 0 ? 'Regenerate' : 'Generate Teams'),
        cr.teams.length > 0 && h(Btn, { onClick: () => setPage('scores') }, 'Enter Scores \u2192'),
      ),
    ),

    // Team cards
    Object.keys(teamGroups).sort((a, b) => a - b).map(teamNo =>
      h(Card, { key: teamNo, className: 'space-y-2' },
        h('div', { className: 'flex justify-between items-center' },
          h('h3', { className: 'font-semibold' }, `Team ${teamNo}`),
          h('span', { className: 'text-xs text-txt-m' },
            `${teamGroups[teamNo].filter(p => p.type !== 'DRAW_PLACEHOLDER').length} players`,
            teamGroups[teamNo].some(p => p.type === 'DRAW_PLACEHOLDER') && ' + draw',
          ),
        ),
        h('div', { className: 'space-y-1' },
          teamGroups[teamNo]
            .sort((a, b) => (a.teamSlot || 'Z').localeCompare(b.teamSlot || 'Z'))
            .map(p => h('div', {
              key: p.playerId,
              className: `flex justify-between items-center py-1 text-sm ${p.type === 'DRAW_PLACEHOLDER' ? 'opacity-60 italic' : ''}`
            },
              h('div', { className: 'flex items-center gap-2' },
                h('span', { className: `text-xs font-medium w-4 ${p.type === 'DRAW_PLACEHOLDER' ? 'text-wrn' : 'text-acc'}` }, p.teamSlot),
                h('span', null, p.playerName),
                p.type === 'DRAW_PLACEHOLDER' && h('span', { className: 'text-xs text-wrn ml-1' }, '\u2190 draw'),
              ),
              h('div', { className: 'flex items-center gap-2 text-txt-m' },
                h('span', { className: 'text-xs' }, p.flight),
                p.courseHandicap != null && h('span', { className: 'mono text-xs' }, `CH:${p.courseHandicap}`),
              ),
            ))
        ),
      )
    ),

    // Taggers
    taggers.length > 0 && h(Card, null,
      h('h3', { className: 'font-semibold mb-2' }, 'Taggers / Individuals'),
      taggers.map(p => h('div', { key: p.playerId, className: 'flex justify-between text-sm py-1' },
        h('span', null, p.playerName),
        p.courseHandicap != null && h('span', { className: 'mono text-xs text-txt-m' }, `CH:${p.courseHandicap}`),
      )),
    ),

    // Unassigned
    unassigned.length > 0 && h(Card, { className: 'border-wrn' },
      h('h3', { className: 'font-semibold text-wrn mb-2' }, 'Unassigned'),
      unassigned.map(p => h('div', { key: p.playerId, className: 'text-sm py-1' }, p.playerName)),
    ),
  );
}

// SCORE ENTRY PAGE
// ═══════════════════════════════════════════════════════════════════

function ScoreEntryPage() {
  const { state, setState, notify, setPage } = useApp();
  const cr = state.currentRound;

  if (!cr || cr.teams.length === 0) {
    return h('div', { className: 'p-4 text-center text-txt-m' },
      'Generate teams first. ',
      h('button', { onClick: () => setPage('teams'), className: 'text-acc underline' }, 'Go to Teams')
    );
  }

  const [activeTeam, setActiveTeam] = useState(1);
  const seenH = new Set();
  const holes = state.courseHoles.filter(ch => ch.courseId === cr.courseId).filter(ch => { if (seenH.has(ch.holeNumber)) return false; seenH.add(ch.holeNumber); return true; }).sort((a, b) => a.holeNumber - b.holeNumber);
  const teamMembers = cr.participants.filter(p => p.teamNo === activeTeam && !p.tagger);
  const teamNos = [...new Set(cr.participants.filter(p => p.teamNo).map(p => p.teamNo))].sort((a, b) => a - b);

  function getScore(playerId, holeNo) {
    return cr.scores.find(s => s.playerId === playerId && s.holeNo === holeNo)?.gross;
  }

  function setScore(playerId, holeNo, value) {
    const val = value === '' ? null : parseInt(value);
    if (val !== null && (isNaN(val) || val < 1 || val > 15)) return;
    setState(s => {
      const scores = [...s.currentRound.scores];
      const idx = scores.findIndex(sc => sc.playerId === playerId && sc.holeNo === holeNo);
      if (idx >= 0) { if (val === null) scores.splice(idx, 1); else scores[idx] = { ...scores[idx], gross: val }; }
      else if (val !== null) { scores.push({ playerId, holeNo, gross: val, playerRowId: cr.participants.find(p => p.playerId === playerId)?.playerRowId }); }
      return { ...s, currentRound: { ...s.currentRound, scores, status: 'SCORES_IN_PROGRESS' } };
    });
  }

  const completionByTeam = {};
  teamNos.forEach(tn => {
    const members = cr.participants.filter(p => p.teamNo === tn && !p.tagger);
    const totalNeeded = members.length * 18;
    const entered = cr.scores.filter(s => members.some(m => m.playerId === s.playerId)).length;
    completionByTeam[tn] = { entered, total: totalNeeded, pct: totalNeeded > 0 ? Math.round(entered / totalNeeded * 100) : 0 };
  });

  const frontPar = holes.filter(h => h.holeNumber <= 9).reduce((s, h) => s + (h.par || 0), 0);
  const backPar = holes.filter(h => h.holeNumber > 9).reduce((s, h) => s + (h.par || 0), 0);

  return h('div', { className: 'max-w-[1400px] mx-auto px-4 py-4 space-y-4' },
    // Team tabs
    h('div', { className: 'flex gap-2 overflow-x-auto pb-1' },
      teamNos.map(tn => h('button', {
        key: tn, onClick: () => setActiveTeam(tn),
        className: `px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap transition-colors ${
          activeTeam === tn ? 'bg-acc text-white shadow-md' : 'bg-white text-txt-m border-2 border-bdr hover:border-acc'}`
      },
        `Team ${tn}`,
        h('span', { className: 'ml-1.5 text-xs opacity-75' }, `${completionByTeam[tn]?.pct || 0}%`),
      )),
    ),

    // Full 18-hole scorecard
    h(Card, { className: 'overflow-x-auto p-4' },
      h('table', { style: { borderCollapse: 'separate', borderSpacing: '3px 5px', minWidth: '1100px', width: '100%' } },
        h('thead', null,
          // Hole numbers
          h('tr', null,
            h('th', { className: 'text-left py-1 px-2 text-sm font-bold w-32' }, 'Player'),
            ...Array.from({ length: 9 }, (_, i) => h('th', { key: i + 1, className: 'text-center text-xs font-bold text-txt-m py-1 w-14' }, i + 1)),
            h('th', { className: 'text-center text-xs font-extrabold text-acc py-1 px-2' }, 'Out'),
            ...Array.from({ length: 9 }, (_, i) => h('th', { key: i + 10, className: 'text-center text-xs font-bold text-txt-m py-1 w-14' }, i + 10)),
            h('th', { className: 'text-center text-xs font-extrabold text-acc py-1 px-2' }, 'In'),
            h('th', { className: 'text-center text-sm font-extrabold text-acc py-1 px-2' }, 'Tot'),
          ),
          // Par row
          h('tr', { className: 'bg-bg-alt/60' },
            h('td', { className: 'px-2 text-xs font-semibold text-txt-m' }, 'Par'),
            ...Array.from({ length: 9 }, (_, i) => { const ho = holes.find(h => h.holeNumber === i + 1); return h('td', { key: i + 1, className: 'text-center text-xs mono text-txt-d' }, ho?.par || ''); }),
            h('td', { className: 'text-center text-xs mono font-bold text-txt-m' }, frontPar || ''),
            ...Array.from({ length: 9 }, (_, i) => { const ho = holes.find(h => h.holeNumber === i + 10); return h('td', { key: i + 10, className: 'text-center text-xs mono text-txt-d' }, ho?.par || ''); }),
            h('td', { className: 'text-center text-xs mono font-bold text-txt-m' }, backPar || ''),
            h('td', { className: 'text-center text-sm mono font-extrabold text-txt' }, (frontPar + backPar) || ''),
          ),
        ),
        h('tbody', null,
          teamMembers.map(p => {
            let front = 0, back = 0, fc = 0, bc = 0;
            for (let i = 1; i <= 18; i++) {
              const s = getScore(p.playerId, i);
              if (s != null) { if (i <= 9) { front += s; fc++; } else { back += s; bc++; } }
            }
            return h('tr', { key: p.playerId },
              h('td', { className: 'px-2 py-1 text-sm font-semibold truncate max-w-[8rem]' },
                p.playerName.split(',')[0],
                p.courseHandicap != null && h('span', { className: 'text-xs text-txt-m font-normal ml-1' }, `(${p.courseHandicap})`),
              ),
              ...Array.from({ length: 9 }, (_, i) => h('td', { key: i + 1, className: 'text-center px-0.5' },
                h('input', { type: 'number', min: 1, max: 15, value: getScore(p.playerId, i + 1) ?? '',
                  onChange: e => setScore(p.playerId, i + 1, e.target.value), className: 'score-cell' })
              )),
              h('td', { className: 'text-center mono text-sm font-bold text-acc px-2' }, fc === 9 ? front : ''),
              ...Array.from({ length: 9 }, (_, i) => h('td', { key: i + 10, className: 'text-center px-0.5' },
                h('input', { type: 'number', min: 1, max: 15, value: getScore(p.playerId, i + 10) ?? '',
                  onChange: e => setScore(p.playerId, i + 10, e.target.value), className: 'score-cell' })
              )),
              h('td', { className: 'text-center mono text-sm font-bold text-acc px-2' }, bc === 9 ? back : ''),
              h('td', { className: 'text-center mono text-base font-extrabold text-acc px-2' }, (fc + bc === 18) ? front + back : ''),
            );
          }),
        ),
      ),
    ),

    // Actions
    h('div', { className: 'flex justify-between' },
      h(Btn, { variant: 'secondary', onClick: () => setPage('teams') }, '\u2190 Teams'),
      h(Btn, { onClick: () => { setPage('results'); notify('Calculating results\u2026'); } }, 'View Results \u2192'),
    ),
  );
}


// ═══════════════════════════════════════════════════════════════════
// RESULTS PAGE
// ═══════════════════════════════════════════════════════════════════

function ResultsPage() {
  const { state, setState, setPage, notify } = useApp();
  const cr = state.currentRound;
  const [tab, setTab] = useState('standings');

  if (!cr) return h('div', { className: 'p-4 text-center text-txt-m' }, 'No active round');

  // ─── Resolve course holes for the selected tee (use first tee as default) ───
  const defaultTee = state.tees.find(t => t.courseId === cr.courseId)?.teeName || '';
  const allHolesForCourse = state.courseHoles.filter(ch => ch.courseId === cr.courseId);
  // Deduplicate: pick the first tee's holes as the canonical set
  const seenHoles = new Set();
  const holes = allHolesForCourse.filter(ch => {
    if (seenHoles.has(ch.holeNumber)) return false;
    seenHoles.add(ch.holeNumber);
    return true;
  }).sort((a, b) => a.holeNumber - b.holeNumber);

  const fmt = state.gameFormats.find(f => f.formatCode === cr.formatCode);
  const teamNos = [...new Set(cr.participants.filter(p => p.teamNo).map(p => p.teamNo))].sort((a, b) => a - b);
  const teamCount = teamNos.length;

  // ─── Stroke allocations per player (cached) ───
  const strokeCache = useMemo(() => {
    const cache = {};
    cr.participants.forEach(p => {
      // Find the right stroke index for this player's tee
      const teeHoles = allHolesForCourse.filter(ch => ch.teeName === (p.selectedTee || defaultTee));
      const useHoles = teeHoles.length >= 18 ? teeHoles : holes;
      cache[p.playerId] = BlitzEngine.allocateStrokes(p.courseHandicap, useHoles);
    });
    return cache;
  }, [cr.participants, cr.scores, allHolesForCourse]);

  // ─── TEAM SCORES ───
  const teamScores = useMemo(() => teamNos.map(tn => {
    let front = 0, back = 0;
    const holeDetails = [];
    for (let holeNo = 1; holeNo <= 18; holeNo++) {
      const members = cr.participants.filter(p => p.teamNo === tn && p.type !== 'DRAW_PLACEHOLDER');
      const contributions = members.map(m => {
        const score = cr.scores.find(s => s.playerId === m.playerId && s.holeNo === holeNo);
        if (!score) return null;
        const hole = holes.find(h => h.holeNumber === holeNo);
        if (!hole) return null;
        const strokes = strokeCache[m.playerId] || {};
        const net = score.gross - (strokes[holeNo] || 0);
        return (fmt?.scoreBasis === 'GROSS') ? score.gross - hole.par : net - hole.par;
      }).filter(c => c != null);

      const teamHole = BlitzEngine.calculateTeamHoleScore(contributions, fmt?.countX || 2, fmt?.teamSizeY || 3, fmt?.zeroTieAdjustmentFlag);
      holeDetails.push(teamHole);
      if (teamHole != null) {
        if (holeNo <= 9) front += teamHole; else back += teamHole;
      }
    }
    return { teamNo: tn, front9Score: front, back9Score: back, total18Score: front + back, holeDetails };
  }), [cr.participants, cr.scores, teamNos, holes, fmt, strokeCache]);

  // ─── PAYOUT MODE ───
  const payoutMode = teamCount >= 6 ? 'TOP3_TOTAL' : 'FRONT_BACK_TOTAL';
  const buckets = payoutMode === 'TOP3_TOTAL' ? ['Total'] : ['Front', 'Back', 'Total'];

  // ─── GAME PAYOUTS (using payout schedule with tie-sharing) ───
  const gamePayouts = useMemo(() => {
    const presentCount = cr.participants.filter(p => p.present).length;
    const gamePool = presentCount * (cr.gameFee || 0);
    if (gamePool === 0 || teamCount === 0 || !fmt?.teamGameEnabled) return {};

    const results = {};
    teamNos.forEach(tn => { results[tn] = { front: 0, back: 0, total: 0, sum: 0 }; });

    buckets.forEach(bucket => {
      const field = bucket === 'Front' ? 'front9Score' : bucket === 'Back' ? 'back9Score' : 'total18Score';
      const bucketPool = payoutMode === 'TOP3_TOTAL' ? gamePool : gamePool / 3;

      // Rank teams for this bucket (lower score = better)
      const sorted = [...teamScores].sort((a, b) => a[field] - b[field]);
      let rank = 1;
      sorted.forEach((t, i) => {
        if (i > 0 && sorted[i][field] !== sorted[i - 1][field]) rank = i + 1;
        t._rank = rank;
      });
      // Count ties
      sorted.forEach(t => {
        t._tieCount = sorted.filter(x => x._rank === t._rank).length;
      });

      sorted.forEach(t => {
        // Sum the pctOfPool for all positions this tied group spans
        const startPos = t._rank;
        const endPos = startPos + t._tieCount - 1;
        let totalPct = 0;
        for (let pos = startPos; pos <= endPos; pos++) {
          const entry = state.payoutSchedule.find(s =>
            s.formatName === fmt.formatName && s.teamCount === teamCount &&
            s.scoreBucket === bucket && s.finishPos === pos
          );
          if (entry) totalPct += entry.pctOfPool;
        }
        const sharedPct = totalPct / t._tieCount;
        const amount = Math.round(bucketPool * sharedPct * 100) / 100;
        const key = bucket === 'Front' ? 'front' : bucket === 'Back' ? 'back' : 'total';
        results[t.teamNo][key] += amount;
        results[t.teamNo].sum = results[t.teamNo].front + results[t.teamNo].back + results[t.teamNo].total;
      });
    });
    return results;
  }, [teamScores, cr.participants, cr.gameFee, state.payoutSchedule, fmt, teamCount, buckets, payoutMode]);

  // ─── SKINS (per-hole detail) ───
  const skinsDetail = useMemo(() => {
    const detail = [];
    for (let holeNo = 1; holeNo <= 18; holeNo++) {
      const eligible = cr.participants.filter(p => p.type !== 'DRAW_PLACEHOLDER' && p.eligibleForSkins !== false);
      const holeScores = eligible.map(p => {
        const score = cr.scores.find(s => s.playerId === p.playerId && s.holeNo === holeNo);
        if (!score) return null;
        const strokes = strokeCache[p.playerId] || {};
        return { playerRowId: p.playerRowId, playerId: p.playerId, playerName: p.playerName,
          gross: score.gross, net: score.gross - (strokes[holeNo] || 0), isPlaceholder: false };
      }).filter(Boolean);

      const grossWinnerId = BlitzEngine.determineSkinWinner(holeScores, 'gross');
      const netWinnerId = BlitzEngine.determineSkinWinner(holeScores, 'net');
      const grossWinner = grossWinnerId ? holeScores.find(s => s.playerRowId === grossWinnerId) : null;
      const netWinner = netWinnerId ? holeScores.find(s => s.playerRowId === netWinnerId) : null;
      const hole = holes.find(h => h.holeNumber === holeNo);

      detail.push({ holeNo, par: hole?.par, grossWinner, netWinner,
        grossScore: grossWinner?.gross, netScore: netWinner?.net });
    }
    return detail;
  }, [cr.participants, cr.scores, holes, strokeCache]);

  const grossSkinsWon = skinsDetail.filter(d => d.grossWinner).length;
  const netSkinsWon = skinsDetail.filter(d => d.netWinner).length;
  const totalSkinsWon = grossSkinsWon + netSkinsWon;
  const presentCount = cr.participants.filter(p => p.present).length;
  const skinsPool = presentCount * (cr.skinsFee || 0);
  const skinsPayout = BlitzEngine.calculateSkinsPayouts(skinsPool, totalSkinsWon);

  // ─── PROCTO ───
  const par3Holes = holes.filter(h => h.par === 3);
  const proctoPool = presentCount * (cr.proctoFee || 0);
  const proctoResults = cr.proctoResults || [];
  const proctoPayouts = BlitzEngine.calculateProctoPayouts(proctoPool, par3Holes.length || 1);

  function setProctoWinner(holeNo, playerId) {
    setState(s => {
      const results = [...(s.currentRound.proctoResults || [])];
      const idx = results.findIndex(r => r.holeNo === holeNo);
      const winner = s.currentRound.participants.find(p => p.playerId === parseInt(playerId));
      if (idx >= 0) {
        if (!playerId) results.splice(idx, 1);
        else results[idx] = { holeNo, playerId: parseInt(playerId), playerName: winner?.playerName || '' };
      } else if (playerId) {
        results.push({ holeNo, playerId: parseInt(playerId), playerName: winner?.playerName || '' });
      }
      return { ...s, currentRound: { ...s.currentRound, proctoResults: results } };
    });
  }

  // ─── PER-PLAYER WINNINGS SUMMARY ───
  const playerWinnings = useMemo(() => {
    const pw = {};
    cr.participants.filter(p => p.present).forEach(p => {
      pw[p.playerId] = { name: p.playerName, game: 0, skins: 0, procto: 0, total: 0 };
    });

    // Game winnings: split team payout equally among team members
    Object.entries(gamePayouts).forEach(([tn, payout]) => {
      const members = cr.participants.filter(p => p.teamNo === parseInt(tn) && p.type !== 'DRAW_PLACEHOLDER');
      if (members.length === 0) return;
      const perPlayer = payout.sum / members.length;
      members.forEach(m => { if (pw[m.playerId]) pw[m.playerId].game += perPlayer; });
    });

    // Skins winnings
    if (skinsPayout.perSkin > 0) {
      skinsDetail.forEach(d => {
        if (d.grossWinner && pw[d.grossWinner.playerId]) pw[d.grossWinner.playerId].skins += skinsPayout.perSkin;
        if (d.netWinner && pw[d.netWinner.playerId]) pw[d.netWinner.playerId].skins += skinsPayout.perSkin;
      });
    }

    // Procto winnings
    proctoResults.forEach((pr, i) => {
      if (pw[pr.playerId]) pw[pr.playerId].procto += (proctoPayouts[i] || 0);
    });

    // Totals
    Object.values(pw).forEach(p => { p.total = p.game + p.skins + p.procto; });
    return pw;
  }, [gamePayouts, skinsDetail, skinsPayout, proctoResults, proctoPayouts, cr.participants]);

  const gamePool = presentCount * (cr.gameFee || 0);
  const totalPool = gamePool + skinsPool + proctoPool;

  // ─── Tab content ───
  const tabs = [
    { id: 'standings', label: 'Standings' },
    { id: 'skins', label: `Skins (${totalSkinsWon})` },
    { id: 'proctos', label: 'Proctos' },
    { id: 'payouts', label: 'Payouts' },
    { id: 'email', label: '\u2709 Email Snapshot' },
  ];

  return h('div', { className: 'max-w-[1400px] mx-auto px-6 py-4 space-y-4' },
    // Pools hero
    h('div', { className: 'grad-accent rounded-2xl p-6 text-white shadow-md text-center' },
      h('div', { className: 'text-[10px] font-bold tracking-[0.2em] uppercase opacity-70' }, 'Total Pool'),
      h('div', { className: 'text-4xl font-extrabold mt-1' }, `$${totalPool.toFixed(2)}`),
      h('div', { className: 'text-xs opacity-70 mt-1' }, `${presentCount} players \u00d7 $${(cr.gameFee + cr.skinsFee + cr.proctoFee).toFixed(2)}`),
      h('div', { className: 'grid grid-cols-3 gap-4 mt-4 pt-4 border-t border-white/20 text-sm' },
        h('div', null, h('div', { className: 'text-lg font-bold' }, `$${gamePool.toFixed(0)}`), h('div', { className: 'text-[10px] opacity-60 uppercase tracking-wide' }, 'Game')),
        h('div', null, h('div', { className: 'text-lg font-bold' }, `$${skinsPool.toFixed(0)}`), h('div', { className: 'text-[10px] opacity-60 uppercase tracking-wide' }, 'Skins')),
        h('div', null, h('div', { className: 'text-lg font-bold' }, `$${proctoPool.toFixed(0)}`), h('div', { className: 'text-[10px] opacity-60 uppercase tracking-wide' }, 'Procto')),
      ),
    ),

    // Result tabs
    h('div', { className: 'flex gap-1 overflow-x-auto' },
      tabs.map(t => h('button', {
        key: t.id, onClick: () => setTab(t.id),
        className: `px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap transition-colors ${
          tab === t.id ? 'bg-acc text-white' : 'bg-bg-alt text-txt-m border border-bdr'}`
      }, t.label))
    ),

    // ═══ STANDINGS TAB ═══
    tab === 'standings' && h(Card, null,
      h('div', { className: 'flex justify-between items-center mb-3' },
        h('h3', { className: 'font-semibold' }, 'Team Standings'),
        h('span', { className: 'text-xs px-2 py-0.5 rounded-full bg-inf-l text-inf' }, payoutMode === 'TOP3_TOTAL' ? 'Total Only (6+)' : 'Front / Back / Total'),
      ),
      h('table', { className: 'w-full text-sm' },
        h('thead', null,
          h('tr', { className: 'text-[11px] font-bold text-txt-m uppercase tracking-wide bg-bg-alt border-b-2 border-bdr' },
            h('th', { className: 'text-left py-2.5 px-4 w-10' }, '#'),
            h('th', { className: 'text-left py-2.5 px-4' }, 'Team'),
            payoutMode !== 'TOP3_TOTAL' && h('th', { className: 'text-center py-2.5 px-4' }, 'Front'),
            payoutMode !== 'TOP3_TOTAL' && h('th', { className: 'text-center py-2.5 px-4' }, 'Back'),
            h('th', { className: 'text-center py-2.5 px-4' }, 'Total'),
            h('th', { className: 'text-right py-2.5 px-4' }, 'Payout'),
          ),
        ),
        h('tbody', null,
          [...teamScores].sort((a, b) => a.total18Score - b.total18Score).map((t, i, arr) => {
            const rank = i === 0 || arr[i].total18Score !== arr[i-1].total18Score ? i + 1 : '';
            const payout = gamePayouts[t.teamNo];
            const isWinner = i === 0;
            return h('tr', { key: t.teamNo, className: `border-b border-bdr/40 ${isWinner ? 'text-acc font-semibold' : ''}` },
              h('td', { className: 'py-3 px-4 text-txt-m' }, rank),
              h('td', { className: 'py-3 px-4' },
                `Team ${t.teamNo}`,
                h('div', { className: 'text-xs text-txt-d font-normal' },
                  cr.participants.filter(p => p.teamNo === t.teamNo && p.type !== 'DRAW_PLACEHOLDER')
                    .map(p => p.playerName.split(',')[0]).join(', ')
                ),
              ),
              payoutMode !== 'TOP3_TOTAL' && h('td', { className: 'text-center mono text-sm px-4' }, t.front9Score.toFixed(1)),
              payoutMode !== 'TOP3_TOTAL' && h('td', { className: 'text-center mono text-sm px-4' }, t.back9Score.toFixed(1)),
              h('td', { className: 'text-center mono text-sm font-bold px-4' }, t.total18Score.toFixed(1)),
              h('td', { className: 'text-right mono text-sm px-4' },
                payout?.sum > 0 ? `$${payout.sum.toFixed(2)}` : ''
              ),
            );
          })
        ),
      ),
      // Payout breakdown for FRONT_BACK_TOTAL mode
      payoutMode !== 'TOP3_TOTAL' && h('div', { className: 'mt-3 pt-3 border-t border-bdr' },
        h('div', { className: 'text-xs text-txt-m mb-2' }, 'Payout breakdown by bucket'),
        h('div', { className: 'grid grid-cols-3 gap-2 text-sm' },
          ['Front', 'Back', 'Total'].map(bucket => {
            const field = bucket === 'Front' ? 'front9Score' : bucket === 'Back' ? 'back9Score' : 'total18Score';
            const winner = [...teamScores].sort((a, b) => a[field] - b[field])[0];
            const key = bucket.toLowerCase();
            return h('div', { key: bucket, className: 'bg-bg-alt rounded-lg p-2 text-center' },
              h('div', { className: 'text-xs text-txt-m' }, bucket),
              h('div', { className: 'font-medium' }, `Team ${winner?.teamNo}`),
              h('div', { className: 'mono text-xs text-acc' }, `$${(gamePool / 3).toFixed(2)}`),
            );
          })
        ),
      ),
    ),

    // ═══ SKINS TAB ═══
    tab === 'skins' && h(Card, null,
      h('div', { className: 'flex justify-between items-center mb-3' },
        h('h3', { className: 'font-semibold' }, 'Skins Detail'),
        h('div', { className: 'text-sm' },
          h('span', { className: 'mono text-acc font-medium' }, `$${skinsPayout.perSkin}`),
          h('span', { className: 'text-txt-m' }, '/skin'),
          skinsPayout.kitty > 0 && h('span', { className: 'text-wrn ml-2 text-xs' }, `$${skinsPayout.kitty} kitty`),
        ),
      ),
      h('table', { className: 'w-full text-sm' },
        h('thead', null,
          h('tr', { className: 'text-[11px] font-bold text-txt-m uppercase tracking-wide bg-bg-alt border-b-2 border-bdr' },
            h('th', { className: 'text-left py-2.5 px-4 w-16' }, 'Hole'),
            h('th', { className: 'text-center py-2.5 px-4 w-14' }, 'Par'),
            h('th', { className: 'text-left py-2.5 px-4' }, 'Gross Skin'),
            h('th', { className: 'text-left py-2.5 px-4' }, 'Net Skin'),
          ),
        ),
        h('tbody', null,
          skinsDetail.map(d => {
            const hasWinner = d.grossWinner || d.netWinner;
            return h('tr', { key: d.holeNo, className: `border-b border-bdr/40 ${hasWinner ? '' : 'text-txt-d'}` },
              h('td', { className: 'py-2.5 px-4 font-semibold' }, d.holeNo),
              h('td', { className: 'text-center px-4' }, d.par),
              h('td', { className: 'py-2.5 px-4' },
                d.grossWinner
                  ? h('span', null,
                      h('span', { className: 'font-medium' }, d.grossWinner.playerName.split(',')[0]),
                      h('span', { className: 'mono text-txt-m ml-1' }, `(${d.grossScore})`),
                    )
                  : h('span', { className: 'text-txt-d' }, '\u2014')
              ),
              h('td', { className: 'py-1.5' },
                d.netWinner
                  ? h('span', null,
                      h('span', { className: 'font-medium' }, d.netWinner.playerName.split(',')[0]),
                      h('span', { className: 'mono text-txt-m ml-1' }, `(${d.netScore})`),
                    )
                  : h('span', { className: 'text-txt-d' }, '\u2014')
              ),
            );
          }),
          // Totals row
          h('tr', { className: 'font-semibold border-t-2 border-bdr' },
            h('td', { className: 'py-2', colSpan: 2 }, 'Total'),
            h('td', { className: 'py-2' }, `${grossSkinsWon} skin${grossSkinsWon !== 1 ? 's' : ''}`),
            h('td', { className: 'py-2' }, `${netSkinsWon} skin${netSkinsWon !== 1 ? 's' : ''}`),
          ),
        ),
      ),
      // Per-player skins winnings
      (() => {
        const skinsByPlayer = {};
        skinsDetail.forEach(d => {
          if (d.grossWinner) {
            if (!skinsByPlayer[d.grossWinner.playerId]) skinsByPlayer[d.grossWinner.playerId] = { name: d.grossWinner.playerName, gross: 0, net: 0 };
            skinsByPlayer[d.grossWinner.playerId].gross++;
          }
          if (d.netWinner) {
            if (!skinsByPlayer[d.netWinner.playerId]) skinsByPlayer[d.netWinner.playerId] = { name: d.netWinner.playerName, gross: 0, net: 0 };
            skinsByPlayer[d.netWinner.playerId].net++;
          }
        });
        const playerList = Object.entries(skinsByPlayer).sort((a, b) => (b[1].gross + b[1].net) - (a[1].gross + a[1].net));
        if (playerList.length === 0) return null;
        return h('div', { className: 'mt-3 pt-3 border-t border-bdr' },
          h('div', { className: 'text-xs text-txt-m mb-2' }, 'Player skins won'),
          playerList.map(([pid, info]) => h('div', {
            key: pid, className: 'flex justify-between text-sm py-0.5'
          },
            h('span', null, info.name.split(',')[0]),
            h('span', { className: 'mono' },
              `${info.gross}G + ${info.net}N = `,
              h('span', { className: 'text-acc font-medium' }, `$${(info.gross + info.net) * skinsPayout.perSkin}`),
            ),
          ))
        );
      })(),
    ),

    // ═══ PROCTOS TAB ═══
    tab === 'proctos' && h(Card, null,
      h('h3', { className: 'font-semibold mb-3' }, 'Procto Entry'),
      (() => {
        const baseAmt = par3Holes.length > 0 ? Math.floor(proctoPool / par3Holes.length) : 0;
        const remainder = par3Holes.length > 0 ? proctoPool - (baseAmt * par3Holes.length) : 0;
        return h('div', { className: 'text-sm text-txt-m mb-4 space-y-1' },
          h('div', null, `$${proctoPool.toFixed(2)} pool \u00f7 ${par3Holes.length} par-3 holes = $${baseAmt.toFixed(2)} per hole`),
          remainder > 0 && h('div', null, `$${remainder.toFixed(2)} remainder added to Hole ${par3Holes[par3Holes.length - 1]?.holeNumber || '?'}`),
        );
      })(),
      par3Holes.length === 0
        ? h('div', { className: 'text-sm text-wrn py-4 text-center' }, 'No par-3 holes defined for this course')
        : h('table', { className: 'w-full text-sm' },
            h('thead', null,
              h('tr', { className: 'text-[11px] font-bold text-txt-m uppercase tracking-wide bg-bg-alt border-b-2 border-bdr' },
                h('th', { className: 'text-left py-2.5 px-4 w-20' }, 'Hole'),
                h('th', { className: 'text-center py-2.5 px-4 w-24' }, 'Payout'),
                h('th', { className: 'text-left py-2.5 px-4' }, 'Winner'),
              ),
            ),
            h('tbody', null,
              par3Holes.map((hole, i) => {
                const existing = proctoResults.find(r => r.holeNo === hole.holeNumber);
                const payoutAmt = proctoPayouts[i] || 0;
                return h('tr', { key: hole.holeNumber, className: 'border-b border-bdr/40' },
                  h('td', { className: 'py-3 px-4 font-semibold' }, `Hole ${hole.holeNumber}`),
                  h('td', { className: 'py-3 px-4 text-center mono font-bold text-acc' }, `$${payoutAmt.toFixed(2)}`),
                  h('td', { className: 'py-3 px-4' },
                    h('select', {
                      value: existing?.playerId || '',
                      onChange: e => setProctoWinner(hole.holeNumber, e.target.value),
                      className: 'w-full px-3 py-2 rounded-lg border-2 border-gray-400 bg-white text-txt text-sm font-medium'
                    },
                      h('option', { value: '' }, '\u2014 No winner \u2014'),
                      cr.participants.filter(p => p.present && p.type !== 'DRAW_PLACEHOLDER').map(p =>
                        h('option', { key: p.playerId, value: p.playerId }, p.playerName)
                      ),
                    ),
                  ),
                );
              })
            ),
          ),
    ),

    // ═══ PAYOUTS TAB ═══
    tab === 'payouts' && h(Card, null,
      h('h3', { className: 'font-semibold mb-3' }, 'Player Winnings'),
      h('table', { className: 'w-full text-sm' },
        h('thead', null,
          h('tr', { className: 'text-[11px] font-bold text-txt-m uppercase tracking-wide bg-bg-alt border-b-2 border-bdr' },
            h('th', { className: 'text-left py-2.5 px-4' }, 'Player'),
            h('th', { className: 'text-right py-2.5 px-4' }, 'Game'),
            h('th', { className: 'text-right py-2.5 px-4' }, 'Skins'),
            h('th', { className: 'text-right py-2.5 px-4' }, 'Procto'),
            h('th', { className: 'text-right py-2.5 px-4 font-extrabold' }, 'Total'),
          ),
        ),
        h('tbody', null,
          Object.entries(playerWinnings)
            .sort((a, b) => b[1].total - a[1].total)
            .map(([pid, pw]) => {
              if (pw.total === 0 && pw.game === 0) return null;
              return h('tr', { key: pid, className: `border-b border-bdr/40 ${pw.total > 0 ? '' : 'text-txt-d'}` },
                h('td', { className: 'py-3 px-4 font-semibold' }, pw.name.split(',')[0]),
                h('td', { className: 'text-right py-3 px-4 mono' }, pw.game > 0 ? `$${pw.game.toFixed(2)}` : ''),
                h('td', { className: 'text-right py-3 px-4 mono' }, pw.skins > 0 ? `$${pw.skins.toFixed(2)}` : ''),
                h('td', { className: 'text-right py-3 px-4 mono' }, pw.procto > 0 ? `$${pw.procto.toFixed(2)}` : ''),
                h('td', { className: 'text-right py-3 px-4 mono font-bold text-acc' }, pw.total > 0 ? `$${pw.total.toFixed(2)}` : ''),
              );
            })
            .filter(Boolean)
        ),
        // Totals row
        h('tfoot', null,
          h('tr', { className: 'font-semibold border-t-2 border-bdr' },
            h('td', { className: 'py-2' }, 'Pool Totals'),
            h('td', { className: 'text-right mono' }, `$${gamePool.toFixed(2)}`),
            h('td', { className: 'text-right mono' }, `$${skinsPool.toFixed(2)}`),
            h('td', { className: 'text-right mono' }, `$${proctoPool.toFixed(2)}`),
            h('td', { className: 'text-right mono text-acc' }, `$${totalPool.toFixed(2)}`),
          ),
          (() => {
            const paid = Object.values(playerWinnings).reduce((s, p) => s + p.total, 0);
            const unallocated = totalPool - paid;
            if (Math.abs(unallocated) < 0.01) return null;
            return h('tr', { className: 'text-xs text-wrn' },

            );
          })(),
        ),
      ),
    ),

    // ═══ EMAIL SNAPSHOT TAB ═══
    tab === 'email' && h(Card, { className: 'text-center py-8 space-y-4' },

// HANDICAP PAGE
// ═══════════════════════════════════════════════════════════════════

function HandicapPage() {
  const { state } = useApp();
  const activePlayers = state.players.filter(p => p.active).sort((a, b) => a.displayName.localeCompare(b.displayName));
  const [selectedId, setSelectedId] = useState(activePlayers[0]?.playerId || null);
  const player = state.players.find(p => p.playerId === selectedId);

  // Get all rounds for this player, sorted newest first
  const allRounds = useMemo(() => {
    if (!selectedId) return [];
    return state.handicapRounds
      .filter(r => r.playerId === selectedId)
      .sort((a, b) => new Date(b.playDate) - new Date(a.playDate));
  }, [selectedId, state.handicapRounds]);

  const recent20 = allRounds.slice(0, 20);

  // Calculate which rounds are "counting" (the ones used for the index)
  const countingInfo = useMemo(() => {
    if (recent20.length < 3) return { index: null, countingIds: new Set(), diffToUse: 0, adjustment: 0, label: '' };
    const param = state.handicapCalcParams.find(p => recent20.length >= p.minScores && recent20.length <= p.maxScores);
    if (!param) return { index: null, countingIds: new Set(), diffToUse: 0, adjustment: 0, label: '' };
    
    // Filter for winter eligibility
    const eligible = recent20.filter(r => {
      const pd = new Date(r.playDate);
      const isWinter = BlitzEngine.isWinterDate(pd, state.settings.winterStart, state.settings.winterEnd);
      const now = new Date();
      const nowIsWinter = BlitzEngine.isWinterDate(now, state.settings.winterStart, state.settings.winterEnd);
      return !(isWinter && !nowIsWinter);
    });
    
    const sorted = [...eligible].filter(r => r.differential != null).sort((a, b) => a.differential - b.differential);
    const best = sorted.slice(0, param.differentialsToUse);
    const countingIds = new Set(best.map(r => r.roundId + '|' + r.playerId));
    const avg = best.reduce((s, r) => s + r.differential, 0) / best.length;
    const index = Math.round((avg + param.adjustment) * 10) / 10;
    return { index, countingIds, diffToUse: param.differentialsToUse, adjustment: param.adjustment, label: param.label || '' };
  }, [recent20, state.handicapCalcParams, state.settings]);

  // Course handicap table
  const courseHandicaps = useMemo(() => {
    if (countingInfo.index == null) return [];
    return state.tees.map(t => ({
      courseId: t.courseId,
      courseName: state.courses.find(c => c.courseId === t.courseId)?.courseName || t.courseId,
      teeName: t.teeName,
      rating: t.courseRating,
      slope: t.slopeRating,
      par: t.par,
      courseHdcp: BlitzEngine.calculateCourseHandicap(countingInfo.index, t.slopeRating, t.courseRating, t.par),
    })).sort((a, b) => a.courseName.localeCompare(b.courseName) || a.teeName.localeCompare(b.teeName));
  }, [countingInfo.index, state.tees, state.courses]);

  return h('div', { className: 'max-w-[1400px] mx-auto px-6 py-4 space-y-4' },
    // Player selector bar
    h(Card, { className: 'flex flex-wrap items-end gap-4' },
      h('div', { className: 'flex-1 min-w-[200px]' },
        h(Select, {
          label: 'Select Player',
          value: selectedId || '',
          onChange: e => setSelectedId(parseInt(e.target.value)),
          options: activePlayers.map(p => ({ value: p.playerId, label: p.displayName })),
        }),
      ),
      player && h('div', { className: 'flex gap-6 text-sm' },
        h('div', null, h('div', { className: 'text-[10px] font-bold text-txt-m uppercase tracking-wide' }, 'Player ID'), h('div', { className: 'font-semibold' }, player.playerId)),
        h('div', null, h('div', { className: 'text-[10px] font-bold text-txt-m uppercase tracking-wide' }, 'Rounds'), h('div', { className: 'font-semibold' }, allRounds.length)),
        h('div', null, h('div', { className: 'text-[10px] font-bold text-txt-m uppercase tracking-wide' }, 'Status'), h('div', { className: 'font-semibold' }, countingInfo.label || (recent20.length < 3 ? 'Need 3+ rounds' : ''))),
        h('div', null, h('div', { className: 'text-[10px] font-bold text-txt-m uppercase tracking-wide' }, 'Diffs Used'), h('div', { className: 'font-semibold' }, countingInfo.diffToUse || '\u2014')),
        h('div', null, h('div', { className: 'text-[10px] font-bold text-txt-m uppercase tracking-wide' }, 'Adjustment'), h('div', { className: 'font-semibold' }, countingInfo.adjustment || '0')),
        h('div', null,
          h('div', { className: 'text-[10px] font-bold text-txt-m uppercase tracking-wide' }, 'Handicap Index'),
          h('div', { className: 'text-2xl font-extrabold text-acc' }, countingInfo.index != null ? countingInfo.index.toFixed(1) : '\u2014'),
        ),
      ),
    ),

    // Rounds table + course handicaps — full width stacked
    h('div', { className: 'space-y-4' },
      // Last 20 Rounds
      h(Card, { className: 'p-0 overflow-auto' },
        h('div', { className: 'px-4 py-3 border-b border-bdr' },
          h('h3', { className: 'font-bold text-sm' }, `Last ${recent20.length} Rounds`),
        ),
        h('table', { className: 'w-full text-sm' },
          h('thead', null,
            h('tr', { className: 'text-[11px] font-bold text-txt-m uppercase tracking-wide bg-bg-alt border-b border-bdr' },
              h('th', { className: 'text-left py-2 px-3' }, 'Date'),
              h('th', { className: 'text-left py-2 px-2' }, 'Course'),
              h('th', { className: 'text-left py-2 px-2' }, 'Tee'),
              h('th', { className: 'text-right py-2 px-2' }, 'AGS'),
              h('th', { className: 'text-right py-2 px-2' }, 'Diff'),
              h('th', { className: 'text-right py-2 px-2' }, 'Score'),
              h('th', { className: 'text-center py-2 px-2' }, 'Rank'),
              h('th', { className: 'text-center py-2 px-2' }, 'Counting'),
            ),
          ),
          h('tbody', null,
            recent20.map((r, i) => {
              const key = r.roundId + '|' + r.playerId;
              const isCounting = countingInfo.countingIds.has(key);
              // Rank by differential (1 = lowest)
              const sortedByDiff = [...recent20].filter(x => x.differential != null).sort((a, b) => a.differential - b.differential);
              const rank = sortedByDiff.findIndex(x => x.roundId === r.roundId && x.playerId === r.playerId) + 1;
              return h('tr', {
                key: i,
                className: `border-b border-bdr/40 ${isCounting ? 'bg-green-50 font-semibold' : ''}`
              },
                h('td', { className: 'py-2 px-3 whitespace-nowrap' }, r.playDate ? new Date(r.playDate).toLocaleDateString() : ''),
                h('td', { className: 'py-2 px-2' }, r.courseName || r.courseId),
                h('td', { className: 'py-2 px-2' }, r.tee),
                h('td', { className: 'py-2 px-2 text-right mono' }, r.escAgs || r.totalGross),
                h('td', { className: `py-2 px-2 text-right mono ${isCounting ? 'text-green-700' : ''}` },
                  r.differential != null ? r.differential.toFixed(1) : '\u2014'),
                h('td', { className: 'py-2 px-2 text-right mono' }, r.totalGross),
                h('td', { className: 'py-2 px-2 text-center mono text-txt-m' }, rank || ''),
                h('td', { className: 'py-2 px-2 text-center' },
                  isCounting ? h('span', { className: 'text-green-600 font-bold text-base' }, '\u2713') : ''
                ),
              );
            })
          ),
        ),
      ),

      // Course Handicap Information
      h(Card, { className: 'p-0 overflow-auto' },
        h('div', { className: 'px-4 py-3 border-b border-bdr' },
          h('h3', { className: 'font-bold text-sm' }, 'Course Handicap Information'),
        ),
        countingInfo.index == null
          ? h('div', { className: 'p-4 text-sm text-txt-m' }, 'Need a handicap index to show course handicaps')
          : h('table', { className: 'w-full text-sm' },
              h('thead', null,
                h('tr', { className: 'text-[11px] font-bold text-txt-m uppercase tracking-wide bg-bg-alt border-b border-bdr' },
                  h('th', { className: 'text-left py-2 px-3' }, 'Course'),
                  h('th', { className: 'text-left py-2 px-2' }, 'Tee'),
                  h('th', { className: 'text-right py-2 px-2' }, 'Rating'),
                  h('th', { className: 'text-right py-2 px-2' }, 'Slope'),
                  h('th', { className: 'text-right py-2 px-2' }, 'Par'),
                  h('th', { className: 'text-right py-2 px-2 font-bold' }, 'CH'),
                ),
              ),
              h('tbody', null,
                courseHandicaps.map((ch, i) => h('tr', {
                  key: i,
                  className: 'border-b border-bdr/40'
                },
                  h('td', { className: 'py-1.5 px-3' }, ch.courseName),
                  h('td', { className: 'py-1.5 px-2' }, ch.teeName),
                  h('td', { className: 'py-1.5 px-2 text-right mono' }, ch.rating),
                  h('td', { className: 'py-1.5 px-2 text-right mono' }, ch.slope),
                  h('td', { className: 'py-1.5 px-2 text-right mono' }, ch.par),
                  h('td', { className: 'py-1.5 px-2 text-right mono font-bold text-acc' }, ch.courseHdcp),
                ))
              ),
            ),
      ),
    ),
  );
}

function SettingsPage() {
  const { state, setState, notify, setPage } = useApp();
  const [importing, setImporting] = useState(false);

  function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);

    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        setState(s => ({ ...s, ...data }));
        notify(`Imported: ${data.players?.length || 0} players, ${data.handicapRounds?.length || 0} rounds, ${data.courses?.length || 0} courses`, 'success');
      } catch (err) {
        notify('Import failed: ' + err.message, 'error');
      }
      setImporting(false);
    };
    reader.readAsText(file);
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `blitz-export-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
