// FINALIZE ROUND PAGE
// ═══════════════════════════════════════════════════════════════════

function FinalizePage() {
  const { state, setState, notify, setPage } = useApp();
  const cr = state.currentRound;
  const [confirmed, setConfirmed] = useState(false);

  if (!cr) return h('div', { className: 'p-4 text-center text-txt-m' }, 'No active round');

  const presentCount = cr.participants.filter(p => p.present).length;
  const realPlayers = cr.participants.filter(p => p.type !== 'DRAW_PLACEHOLDER' && p.present && !p.tagger);
  const scoreCount = cr.scores.length;
  const expectedScores = realPlayers.length * 18;
  const completePct = expectedScores > 0 ? Math.round(scoreCount / expectedScores * 100) : 0;

  // Players with complete 18 holes
  const completePlayers = realPlayers.filter(p => {
    let count = 0;
    for (let h = 1; h <= 18; h++) {
      if (cr.scores.find(s => s.playerId === p.playerId && s.holeNo === h)) count++;
    }
    return count === 18;
  });

  const incompletePlayers = realPlayers.filter(p => !completePlayers.includes(p));

  async function finalizeRound() {
    // 0. Pre-finalize backup to Drive if connected
    if (state.settings?.googleClientId) {
      try {
        const backupName = `pre-finalize_${cr.roundDate}.json`;
        await GoogleDrive.saveBackup(state, backupName);
      } catch (e) { console.warn('Backup to Drive failed (continuing):', e); }
    }

    // 1. Build handicap round entries for each complete player
    const newHandicapRounds = [];
    const holes = state.courseHoles.filter(ch => ch.courseId === cr.courseId).sort((a, b) => a.holeNumber - b.holeNumber);
    const seenHoles = new Set();
    const uniqueHoles = holes.filter(ch => { if (seenHoles.has(ch.holeNumber)) return false; seenHoles.add(ch.holeNumber); return true; });

    completePlayers.forEach(p => {
      const holeScores = [];
      let front9 = 0, back9 = 0;
      for (let hno = 1; hno <= 18; hno++) {
        const sc = cr.scores.find(s => s.playerId === p.playerId && s.holeNo === hno);
        const gross = sc ? sc.gross : 0;
        holeScores.push(gross);
        if (hno <= 9) front9 += gross; else back9 += gross;
      }
      const totalGross = front9 + back9;
      const escAgs = totalGross; // ESC disabled per config
      const tee = state.tees.find(t => t.courseId === cr.courseId && t.teeName === p.selectedTee);
      const rating = tee?.courseRating;
      const slope = tee?.slopeRating;
      const diff = (rating && slope && slope > 0) ? Math.round(((escAgs - rating) * 113 / slope) * 10) / 10 : null;

      newHandicapRounds.push({
        playerId: p.playerId,
        playerRowId: p.playerRowId,
        roundId: cr.roundId,
        playDate: cr.roundDate,
        courseId: cr.courseId,
        courseName: cr.courseName,
        tee: p.selectedTee,
        rating, slope,
        courseHandicap: p.courseHandicap,
        holeScores, front9, back9, totalGross, escAgs, differential: diff,
        playableIndex: p.playableIndex,
      });
    });

    // 2. Merge into handicap rounds (upsert by roundId + playerId)
    setState(s => {
      let updatedRounds = [...s.handicapRounds];
      newHandicapRounds.forEach(nr => {
        const existIdx = updatedRounds.findIndex(r => r.roundId === nr.roundId && r.playerId === nr.playerId);
        if (existIdx >= 0) updatedRounds[existIdx] = nr;
        else updatedRounds.push(nr);
      });

      // 3. Archive the round
      const archivedRound = {
        ...s.currentRound,
        status: 'FINALIZED',
        finalizedAt: new Date().toISOString(),
        archivedHandicapCount: newHandicapRounds.length,
        skippedIncompleteCount: incompletePlayers.length,
      };
      const archives = [...(s.roundArchives || []), archivedRound];

      return {
        ...s,
        handicapRounds: updatedRounds,
        roundArchives: archives,
        currentRound: null, // Clear the round
      };
    });

    // Drive: save archive and updated state
    if (state.settings?.googleClientId) {
      try {
        const archiveName = `${cr.roundDate}_${cr.courseId}_${cr.formatCode}.json`;
        await GoogleDrive.saveArchive({
          ...cr, status: 'FINALIZED', finalizedAt: new Date().toISOString(),
          handicapRoundsWritten: newHandicapRounds.length,
        }, archiveName);
        await GoogleDrive.saveState({ ...state, _lastSaved: Date.now(), currentRound: null });
      } catch (e) { console.warn('Drive archive failed (data saved locally):', e); }
    }

    notify(`Round finalized: ${newHandicapRounds.length} scores archived, ${incompletePlayers.length} skipped`, 'success');
    setPage('dashboard');
  }

  return h('div', { className: 'max-w-[1400px] mx-auto px-6 py-4 space-y-4' },
    h(Card, { className: 'space-y-3' },
      h('h3', { className: 'font-semibold' }, 'Finalize Round'),
      h('div', { className: 'text-sm text-txt-m space-y-1' },
        h('div', null, `Date: ${cr.roundDate} \u2022 ${cr.courseName} \u2022 ${cr.gameFormat}`),
        h('div', null, `${presentCount} players present \u2022 ${cr.teams?.length || 0} teams`),
      ),
    ),

    // Completion status
    h(Card, null,
      h('div', { className: 'flex justify-between items-center mb-3' },
        h('h3', { className: 'font-semibold' }, 'Score Completion'),
        h('span', { className: `text-sm font-medium ${completePct === 100 ? 'text-acc' : 'text-wrn'}` }, `${completePct}%`),
      ),
      h('div', { className: 'w-full bg-bg-alt rounded-full h-2 mb-3' },
        h('div', { className: `h-2 rounded-full transition-all ${completePct === 100 ? 'bg-acc' : 'bg-wrn'}`, style: { width: `${completePct}%` } }),
      ),
      h('div', { className: 'text-sm space-y-1' },
        h('div', { className: 'text-acc' }, `${completePlayers.length} players with complete 18-hole scores \u2192 will be archived`),
        incompletePlayers.length > 0 && h('div', { className: 'text-wrn' },
          `${incompletePlayers.length} incomplete \u2192 will be skipped: `,
          incompletePlayers.map(p => p.playerName.split(',')[0]).join(', '),
        ),
      ),
    ),

    // Archive action
    h(Card, { className: 'space-y-3' },
      h('h3', { className: 'font-semibold' }, 'What Finalize Does'),
      h('div', { className: 'text-sm text-txt-m space-y-1' },
        h('div', null, '\u2022 Archives each complete player\u2019s 18-hole scores into handicap history'),
        h('div', null, '\u2022 Calculates and stores the handicap differential for each round'),
        h('div', null, '\u2022 Clears the current round so a new one can be started'),
        h('div', null, '\u2022 Saves a full round archive for audit purposes'),
      ),
      h('label', { className: 'flex items-center gap-2 mt-3 text-sm cursor-pointer' },
        h('input', { type: 'checkbox', checked: confirmed, onChange: () => setConfirmed(!confirmed) }),
        h('span', null, 'I confirm this round is complete and ready to finalize'),
      ),
      h('div', { className: 'flex gap-2 mt-2' },
        h(Btn, { variant: 'secondary', onClick: () => setPage('results') }, '\u2190 Back to Results'),
        h(Btn, {
          variant: 'primary',
          disabled: !confirmed || completePlayers.length === 0,
          onClick: finalizeRound,
        }, `Finalize (${completePlayers.length} players)`),
      ),
    ),
  );
}

// COURSE MANAGEMENT PAGE

function CoursesPage() {
  const { state, setState, notify, setPage } = useApp();
  const [selectedCourse, setSelectedCourse] = useState(null);
  const [showAddCourse, setShowAddCourse] = useState(false);
  const [newCourse, setNewCourse] = useState({ courseId: '', courseName: '' });
  const [showAddTee, setShowAddTee] = useState(false);
  const [newTee, setNewTee] = useState({ teeName: '', courseRating: '', slopeRating: '', par: '72' });
  const [editingHoles, setEditingHoles] = useState(null); // courseId|teeName

  function addCourse() {
    if (!newCourse.courseId.trim() || !newCourse.courseName.trim()) { notify('Course ID and name required', 'error'); return; }
    if (state.courses.find(c => c.courseId === newCourse.courseId)) { notify('Course ID already exists', 'error'); return; }
    setState(s => ({ ...s, courses: [...s.courses, { ...newCourse, active: true }] }));
    setSelectedCourse(newCourse.courseId);
    setShowAddCourse(false);
    setNewCourse({ courseId: '', courseName: '' });
    notify('Course added', 'success');
  }

  function addTee() {
    if (!newTee.teeName.trim() || !selectedCourse) return;
    const tee = {
      courseId: selectedCourse,
      teeName: newTee.teeName.trim(),
      courseRating: parseFloat(newTee.courseRating) || 72,
      slopeRating: parseInt(newTee.slopeRating) || 113,
      par: parseInt(newTee.par) || 72,
    };
    setState(s => ({ ...s, tees: [...s.tees, tee] }));
    // Auto-create 18 hole stubs
    const existingHoles = state.courseHoles.filter(h => h.courseId === selectedCourse && h.teeName === tee.teeName);
    if (existingHoles.length === 0) {
      const newHoles = Array.from({ length: 18 }, (_, i) => ({
        courseId: selectedCourse, teeName: tee.teeName,
        holeNumber: i + 1, par: 4, strokeIndex: i + 1,
      }));
      setState(s => ({ ...s, courseHoles: [...s.courseHoles, ...newHoles] }));
    }
    setShowAddTee(false);
    setNewTee({ teeName: '', courseRating: '', slopeRating: '', par: '72' });
    notify('Tee added with 18 hole stubs', 'success');
  }

  function updateHole(courseId, teeName, holeNumber, field, value) {
    setState(s => ({
      ...s,
      courseHoles: s.courseHoles.map(h =>
        h.courseId === courseId && h.teeName === teeName && h.holeNumber === holeNumber
          ? { ...h, [field]: parseInt(value) || 0 }
          : h
      )
    }));
  }

  const course = state.courses.find(c => c.courseId === selectedCourse);
  const courseTees = state.tees.filter(t => t.courseId === selectedCourse);

  return h('div', { className: 'max-w-[1400px] mx-auto px-6 py-4 space-y-4' },
    // Course list
    !selectedCourse && h('div', { className: 'space-y-3' },
      h('div', { className: 'flex justify-between items-center' },
        h('h3', { className: 'font-semibold' }, `${state.courses.length} Courses`),
        h(Btn, { onClick: () => setShowAddCourse(true) }, '+ Add Course'),
      ),
      state.courses.map(c => {
        const teeCount = state.tees.filter(t => t.courseId === c.courseId).length;
        const holeCount = new Set(state.courseHoles.filter(h => h.courseId === c.courseId).map(h => h.holeNumber)).size;
        return h('button', {
          key: c.courseId, onClick: () => setSelectedCourse(c.courseId),
          className: 'w-full text-left bg-bg-card border border-bdr rounded-xl p-3 hover:border-acc transition-colors'
        },
          h('div', { className: 'flex justify-between' },
            h('div', null,
              h('div', { className: 'font-medium' }, c.courseName),
              h('div', { className: 'text-xs text-txt-m' }, `${c.courseId} \u2022 ${teeCount} tees \u2022 ${holeCount}/18 holes`),
            ),
            h('span', { className: `text-xs px-2 py-0.5 rounded-full ${c.active ? 'bg-acc-l text-acc' : 'bg-bg-alt text-txt-d'}` },
              c.active ? 'Active' : 'Inactive'
            ),
          ),
        );
      }),

      showAddCourse && h(Card, { className: 'space-y-3' },
        h('h3', { className: 'font-semibold' }, 'New Course'),
        h('div', { className: 'grid grid-cols-3 gap-3' },
          h(Input, { label: 'Course ID', placeholder: 'C008', value: newCourse.courseId,
            onChange: e => setNewCourse({ ...newCourse, courseId: e.target.value }) }),
          h('div', { className: 'col-span-2' },
            h(Input, { label: 'Course Name', placeholder: 'Course name', value: newCourse.courseName,
              onChange: e => setNewCourse({ ...newCourse, courseName: e.target.value }) }),
          ),
        ),
        h('div', { className: 'flex gap-2 justify-end' },
          h(Btn, { variant: 'secondary', onClick: () => setShowAddCourse(false) }, 'Cancel'),
          h(Btn, { onClick: addCourse }, 'Add'),
        ),
      ),
    ),

    // Course detail
    selectedCourse && h('div', { className: 'space-y-4' },
      h('button', { onClick: () => { setSelectedCourse(null); setEditingHoles(null); }, className: 'text-sm text-acc' }, '\u2190 All Courses'),

      h(Card, null,
        h('h3', { className: 'font-semibold' }, course?.courseName || selectedCourse),
        h('div', { className: 'text-sm text-txt-m' }, `ID: ${selectedCourse}`),
      ),

      // Tees
      h(Card, { className: 'space-y-3' },
        h('div', { className: 'flex justify-between items-center' },
          h('h3', { className: 'font-semibold' }, 'Tees'),
          h(Btn, { variant: 'secondary', onClick: () => setShowAddTee(true), className: 'text-xs' }, '+ Add Tee'),
        ),
        courseTees.map(t => {
          const holeKey = `${selectedCourse}|${t.teeName}`;
          const teeHoles = state.courseHoles.filter(h => h.courseId === selectedCourse && h.teeName === t.teeName).sort((a, b) => a.holeNumber - b.holeNumber);
          return h('div', { key: t.teeName, className: 'border border-bdr rounded-lg p-2' },
            h('div', { className: 'flex justify-between items-center' },
              h('div', null,
                h('span', { className: 'font-medium text-sm' }, t.teeName),
                h('span', { className: 'text-xs text-txt-m ml-2' }, `R:${t.courseRating} S:${t.slopeRating} P:${t.par}`),
              ),
              h('button', {
                onClick: () => setEditingHoles(editingHoles === holeKey ? null : holeKey),
                className: 'text-xs text-acc',
              }, editingHoles === holeKey ? 'Close holes' : `Edit holes (${teeHoles.length})`),
            ),
            // Hole editor
            editingHoles === holeKey && h('div', { className: 'mt-2 overflow-x-auto' },
              h('table', { className: 'w-full text-xs' },
                h('thead', null,
                  h('tr', { className: 'text-txt-m' },
                    h('th', { className: 'text-left py-1 w-12' }, 'Hole'),
                    h('th', { className: 'text-center py-1 w-14' }, 'Par'),
                    h('th', { className: 'text-center py-1 w-14' }, 'SI'),
                  ),
                ),
                h('tbody', null,
                  Array.from({ length: 18 }, (_, i) => i + 1).map(hno => {
                    const hole = teeHoles.find(h => h.holeNumber === hno) || { par: 4, strokeIndex: hno };
                    return h('tr', { key: hno, className: 'border-t border-bdr/30' },
                      h('td', { className: 'py-0.5 font-medium' }, hno),
                      h('td', { className: 'text-center' },
                        h('input', { type: 'number', min: 3, max: 5, value: hole.par,
                          onChange: e => updateHole(selectedCourse, t.teeName, hno, 'par', e.target.value),
                          className: 'w-10 text-center rounded border border-bdr/50 bg-bg text-xs py-0.5' }),
                      ),
                      h('td', { className: 'text-center' },
                        h('input', { type: 'number', min: 1, max: 18, value: hole.strokeIndex,
                          onChange: e => updateHole(selectedCourse, t.teeName, hno, 'strokeIndex', e.target.value),
                          className: 'w-10 text-center rounded border border-bdr/50 bg-bg text-xs py-0.5' }),
                      ),
                    );
                  })
                ),
              ),
            ),
          );
        }),

        showAddTee && h('div', { className: 'border-t border-bdr pt-3 space-y-2' },
          h('div', { className: 'grid grid-cols-4 gap-2' },
            h(Input, { label: 'Tee Name', placeholder: 'Yellow', value: newTee.teeName,
              onChange: e => setNewTee({ ...newTee, teeName: e.target.value }) }),
            h(Input, { label: 'Rating', type: 'number', step: '0.1', value: newTee.courseRating,
              onChange: e => setNewTee({ ...newTee, courseRating: e.target.value }) }),
            h(Input, { label: 'Slope', type: 'number', value: newTee.slopeRating,
              onChange: e => setNewTee({ ...newTee, slopeRating: e.target.value }) }),
            h(Input, { label: 'Par', type: 'number', value: newTee.par,
              onChange: e => setNewTee({ ...newTee, par: e.target.value }) }),
          ),
          h('div', { className: 'flex gap-2 justify-end' },
            h(Btn, { variant: 'secondary', onClick: () => setShowAddTee(false) }, 'Cancel'),
            h(Btn, { onClick: addTee }, 'Add Tee'),
          ),
        ),
      ),
    ),

    // Nav
    h('div', { className: 'flex gap-2' },
      h(Btn, { variant: 'ghost', onClick: () => setPage('settings') }, 'Settings'),
      h(Btn, { variant: 'ghost', onClick: () => setPage('dashboard') }, 'Dashboard'),
    ),
  );
}

// PLAYER TEE DEFAULTS PAGE
// ═══════════════════════════════════════════════════════════════════

function TeeDefaultsPage() {
  const { state, setState, notify, setPage } = useApp();
  const [selectedCourse, setSelectedCourse] = useState(state.courses[0]?.courseId || '');
  const courseTees = state.tees.filter(t => t.courseId === selectedCourse);
  const activePlayers = state.players.filter(p => p.active).sort((a, b) => a.displayName.localeCompare(b.displayName));

  function getDefault(playerId) {
    return state.playerTeeDefaults.find(d => d.playerId === playerId && d.courseId === selectedCourse)?.teeDefault || '';
  }

  function setDefault(playerId, teeName) {
    setState(s => {
      const defs = [...s.playerTeeDefaults];
      const idx = defs.findIndex(d => d.playerId === playerId && d.courseId === selectedCourse);
      if (idx >= 0) {
        if (teeName) defs[idx] = { ...defs[idx], teeDefault: teeName };
        else defs.splice(idx, 1);
      } else if (teeName) {
        defs.push({ playerId, courseId: selectedCourse, teeDefault: teeName });
      }
      return { ...s, playerTeeDefaults: defs };
    });
  }

  function bulkSet(teeName) {
    setState(s => {
      const defs = s.playerTeeDefaults.filter(d => d.courseId !== selectedCourse);
      activePlayers.forEach(p => {
        if (!defs.find(d => d.playerId === p.playerId && d.courseId === selectedCourse)) {
          defs.push({ playerId: p.playerId, courseId: selectedCourse, teeDefault: teeName });
        }
      });
      return { ...s, playerTeeDefaults: defs };
    });
    notify(`Set ${teeName} as default for all players`, 'success');
  }

  const setCount = activePlayers.filter(p => getDefault(p.playerId)).length;

  return h('div', { className: 'max-w-[1400px] mx-auto px-6 py-4 space-y-4' },
    h('div', { className: 'flex gap-2 items-end' },
      h(Select, {
        label: 'Course', value: selectedCourse,
        onChange: e => setSelectedCourse(e.target.value),
        options: state.courses.map(c => ({ value: c.courseId, label: c.courseName })),
      }),
      courseTees.length > 0 && h('div', null,
        h('div', { className: 'text-xs text-txt-m mb-1' }, 'Bulk set all'),
        h('div', { className: 'flex gap-1' },
          courseTees.map(t => h('button', {
            key: t.teeName, onClick: () => bulkSet(t.teeName),
            className: 'px-2 py-1 text-xs rounded border border-bdr hover:border-acc'
          }, t.teeName))
        ),
      ),
    ),
    h('div', { className: 'text-xs text-txt-m' }, `${setCount}/${activePlayers.length} players have defaults for this course`),

    h(Card, { className: 'p-0 divide-y divide-bdr overflow-hidden' },
      activePlayers.map(p => h('div', {
        key: p.playerId,
        className: 'flex items-center justify-between px-3 py-1.5'
      },
        h('span', { className: 'text-sm truncate flex-1' }, p.displayName),
        h('select', {
          value: getDefault(p.playerId),
          onChange: e => setDefault(p.playerId, e.target.value),
          className: 'w-28 px-2 py-1 text-sm rounded border border-bdr bg-bg text-txt'
        },
          h('option', { value: '' }, '\u2014'),
          courseTees.map(t => h('option', { key: t.teeName, value: t.teeName }, t.teeName))
        ),
      ))
    ),

    h(Btn, { variant: 'ghost', onClick: () => setPage('settings') }, '\u2190 Settings'),
  );
}

// PAYOUT SCHEDULE PAGE
// ═══════════════════════════════════════════════════════════════════

function PayoutSchedulePage() {
  const { state, setState, notify, setPage } = useApp();
  const formats = state.gameFormats.filter(f => f.teamGameEnabled);
  const [selFormat, setSelFormat] = useState(formats[0]?.formatName || '');
  const [selTeamCount, setSelTeamCount] = useState(6);

  const entries = state.payoutSchedule
    .filter(s => s.formatName === selFormat && s.teamCount === selTeamCount)
    .sort((a, b) => {
      const bucketOrder = { Front: 0, Back: 1, Total: 2 };
      return (bucketOrder[a.scoreBucket] || 0) - (bucketOrder[b.scoreBucket] || 0) || a.finishPos - b.finishPos;
    });

  const mode = selTeamCount >= 6 ? 'TOP3_TOTAL' : 'FRONT_BACK_TOTAL';
  const totalPct = entries.reduce((s, e) => s + (e.pctOfPool || 0), 0);

  function updateEntry(bucket, pos, pct) {
    setState(s => {
      const schedule = [...s.payoutSchedule];
      const idx = schedule.findIndex(e => e.formatName === selFormat && e.teamCount === selTeamCount && e.scoreBucket === bucket && e.finishPos === pos);
      if (idx >= 0) {
        schedule[idx] = { ...schedule[idx], pctOfPool: parseFloat(pct) || 0 };
      } else {
        schedule.push({ formatName: selFormat, teamCount: selTeamCount, scoreBucket: bucket, finishPos: pos, pctOfPool: parseFloat(pct) || 0, payoutMode: mode });
      }
      return { ...s, payoutSchedule: schedule };
    });
  }

  function addPosition(bucket) {
    const existing = entries.filter(e => e.scoreBucket === bucket);
    const nextPos = existing.length > 0 ? Math.max(...existing.map(e => e.finishPos)) + 1 : 1;
    updateEntry(bucket, nextPos, 0);
  }

  const buckets = mode === 'TOP3_TOTAL' ? ['Total'] : ['Front', 'Back', 'Total'];

  return h('div', { className: 'max-w-[1400px] mx-auto px-6 py-4 space-y-4' },
    h('div', { className: 'grid grid-cols-2 gap-3' },
      h(Select, {
        label: 'Format', value: selFormat,
        onChange: e => setSelFormat(e.target.value),
        options: formats.map(f => ({ value: f.formatName, label: f.formatName })),
      }),
      h(Select, {
        label: 'Team Count', value: selTeamCount,
        onChange: e => setSelTeamCount(parseInt(e.target.value)),
        options: Array.from({ length: 9 }, (_, i) => ({ value: i + 2, label: `${i + 2} teams` })),
      }),
    ),

    h('div', { className: 'flex justify-between items-center text-sm' },
      h('span', { className: 'px-2 py-0.5 rounded-full bg-inf-l text-inf text-xs' }, mode),
      h('span', { className: `font-medium ${Math.abs(totalPct - 1) < 0.001 ? 'text-acc' : 'text-wrn'}` },
        `Total: ${(totalPct * 100).toFixed(1)}%`,
        Math.abs(totalPct - 1) > 0.001 && ' (should be 100%)',
      ),
    ),

    buckets.map(bucket => h(Card, { key: bucket, className: 'space-y-2' },
      h('div', { className: 'flex justify-between items-center' },
        h('h3', { className: 'font-semibold text-sm' }, bucket),
        h('button', { onClick: () => addPosition(bucket), className: 'text-xs text-acc' }, '+ Add position'),
      ),
      entries.filter(e => e.scoreBucket === bucket).map(e =>
        h('div', { key: `${e.scoreBucket}-${e.finishPos}`, className: 'flex items-center gap-3' },
          h('span', { className: 'text-sm text-txt-m w-16' }, `${e.finishPos}${e.finishPos === 1 ? 'st' : e.finishPos === 2 ? 'nd' : e.finishPos === 3 ? 'rd' : 'th'}`),
          h('input', {
            type: 'number', step: '0.01', min: 0, max: 1,
            value: e.pctOfPool?.toFixed(4) || '',
            onChange: ev => updateEntry(e.scoreBucket, e.finishPos, ev.target.value),
            className: 'flex-1 px-2 py-1 rounded border border-bdr bg-bg text-sm mono'
          }),
          h('span', { className: 'text-xs text-txt-m w-14 text-right' }, `${((e.pctOfPool || 0) * 100).toFixed(1)}%`),
        )
      ),
      entries.filter(e => e.scoreBucket === bucket).length === 0 &&
        h('div', { className: 'text-xs text-txt-d text-center py-2' }, 'No entries \u2014 add a position'),
    )),

    h(Btn, { variant: 'ghost', onClick: () => setPage('settings') }, '\u2190 Settings'),
  );
}


// ═══════════════════════════════════════════════════════════════════
// PRINTABLE SNAPSHOT PAGE
// ═══════════════════════════════════════════════════════════════════

function SnapshotPage() {
  const { state, setPage, notify } = useApp();
  const cr = state.currentRound;

  if (!cr) return h('div', { className: 'p-4 text-center text-txt-m' }, 'No active round');

  const allHolesForCourse = state.courseHoles.filter(ch => ch.courseId === cr.courseId);
  const seenH = new Set();
  const holes = allHolesForCourse.filter(ch => { if (seenH.has(ch.holeNumber)) return false; seenH.add(ch.holeNumber); return true; }).sort((a, b) => a.holeNumber - b.holeNumber);
  const fmt = state.gameFormats.find(f => f.formatCode === cr.formatCode);
  const presentPlayers = cr.participants.filter(p => p.present && p.type !== 'DRAW_PLACEHOLDER');
  const presentCount = presentPlayers.length;
  const teamNos = [...new Set(cr.participants.filter(p => p.teamNo).map(p => p.teamNo))].sort((a, b) => a - b);
  const par3Holes = holes.filter(h => h.par === 3);

  // Pools
  const gamePool = presentCount * (cr.gameFee || 0);
  const skinsPool = presentCount * (cr.skinsFee || 0);
  const proctoPool = presentCount * (cr.proctoFee || 0);
  const totalPool = gamePool + skinsPool + proctoPool;

  // Stroke allocations
  const strokeCache = {};
  cr.participants.forEach(p => {
    const teeHoles = allHolesForCourse.filter(ch => ch.teeName === p.selectedTee);
    strokeCache[p.playerId] = BlitzEngine.allocateStrokes(p.courseHandicap, teeHoles.length >= 18 ? teeHoles : holes);
  });

  // Skins per hole
  const skinsMap = {};
  for (let hno = 1; hno <= 18; hno++) {
    const eligible = cr.participants.filter(p => p.type !== 'DRAW_PLACEHOLDER' && p.eligibleForSkins !== false);
    const holeScores = eligible.map(p => {
      const sc = cr.scores.find(s => s.playerId === p.playerId && s.holeNo === hno);
      if (!sc) return null;
      const strokes = strokeCache[p.playerId] || {};
      return { playerRowId: p.playerRowId, playerId: p.playerId, playerName: p.playerName, gross: sc.gross, net: sc.gross - (strokes[hno] || 0) };
    }).filter(Boolean);
    const gw = BlitzEngine.determineSkinWinner(holeScores, 'gross');
    const nw = BlitzEngine.determineSkinWinner(holeScores, 'net');
    skinsMap[hno] = {
      grossWinner: gw ? holeScores.find(s => s.playerRowId === gw) : null,
      netWinner: nw ? holeScores.find(s => s.playerRowId === nw) : null,
    };
  }
  const totalGrossSkins = Object.values(skinsMap).filter(s => s.grossWinner).length;
  const totalNetSkins = Object.values(skinsMap).filter(s => s.netWinner).length;
  const totalSkinsWon = totalGrossSkins + totalNetSkins;
  const skinsPayout = BlitzEngine.calculateSkinsPayouts(skinsPool, totalSkinsWon);

  // Proctos
  const proctoResults = cr.proctoResults || [];
  const proctoPayouts = BlitzEngine.calculateProctoPayouts(proctoPool, par3Holes.length || 1);

  // Team game scores + payouts (reuse from results engine)
  const teamScores = teamNos.map(tn => {
    let front = 0, back = 0;
    for (let hno = 1; hno <= 18; hno++) {
      const members = cr.participants.filter(p => p.teamNo === tn && p.type !== 'DRAW_PLACEHOLDER');
      const contribs = members.map(m => {
        const sc = cr.scores.find(s => s.playerId === m.playerId && s.holeNo === hno);
        if (!sc) return null;
        const hole = holes.find(h => h.holeNumber === hno);
        if (!hole) return null;
        const strokes = strokeCache[m.playerId] || {};
        const net = sc.gross - (strokes[hno] || 0);
        return (fmt?.scoreBasis === 'GROSS') ? sc.gross - hole.par : net - hole.par;
      }).filter(c => c != null);
      const th = BlitzEngine.calculateTeamHoleScore(contribs, fmt?.countX || 2, fmt?.teamSizeY || 3, fmt?.zeroTieAdjustmentFlag);
      if (th != null) { if (hno <= 9) front += th; else back += th; }
    }
    return { teamNo: tn, front9Score: front, back9Score: back, total18Score: front + back };
  });

  const payoutMode = teamNos.length >= 6 ? 'TOP3_TOTAL' : 'FRONT_BACK_TOTAL';
  const buckets = payoutMode === 'TOP3_TOTAL' ? ['Total'] : ['Front', 'Back', 'Total'];
  const gamePayouts = {};
  teamNos.forEach(tn => { gamePayouts[tn] = { front: 0, back: 0, total: 0, sum: 0 }; });
  buckets.forEach(bucket => {
    const field = bucket === 'Front' ? 'front9Score' : bucket === 'Back' ? 'back9Score' : 'total18Score';
    const bucketPool = payoutMode === 'TOP3_TOTAL' ? gamePool : gamePool / 3;
    const sorted = [...teamScores].sort((a, b) => a[field] - b[field]);
    let rank = 1;
    sorted.forEach((t, i) => { if (i > 0 && sorted[i][field] !== sorted[i - 1][field]) rank = i + 1; t._rank = rank; });
    sorted.forEach(t => { t._tieCount = sorted.filter(x => x._rank === t._rank).length; });
    sorted.forEach(t => {
      let totalPct = 0;
      for (let pos = t._rank; pos <= t._rank + t._tieCount - 1; pos++) {
        const entry = state.payoutSchedule.find(s => s.formatName === fmt?.formatName && s.teamCount === teamNos.length && s.scoreBucket === bucket && s.finishPos === pos);
        if (entry) totalPct += entry.pctOfPool;
      }
      const amt = Math.round(bucketPool * (totalPct / t._tieCount) * 100) / 100;
      const key = bucket === 'Front' ? 'front' : bucket === 'Back' ? 'back' : 'total';
      gamePayouts[t.teamNo][key] += amt;
      gamePayouts[t.teamNo].sum = gamePayouts[t.teamNo].front + gamePayouts[t.teamNo].back + gamePayouts[t.teamNo].total;
    });
  });

  // Per-player winnings
  const pw = {};
  presentPlayers.forEach(p => { pw[p.playerId] = { name: p.playerName, team: p.teamNo, hdcp: p.courseHandicap, game: 0, skins: 0, procto: 0, total: 0 }; });
  Object.entries(gamePayouts).forEach(([tn, pay]) => {
    const members = cr.participants.filter(p => p.teamNo === parseInt(tn) && p.type !== 'DRAW_PLACEHOLDER');
    if (!members.length) return;
    const each = pay.sum / members.length;
    members.forEach(m => { if (pw[m.playerId]) pw[m.playerId].game += each; });
  });
  if (skinsPayout.perSkin > 0) {
    Object.values(skinsMap).forEach(s => {
      if (s.grossWinner && pw[s.grossWinner.playerId]) pw[s.grossWinner.playerId].skins += skinsPayout.perSkin;
      if (s.netWinner && pw[s.netWinner.playerId]) pw[s.netWinner.playerId].skins += skinsPayout.perSkin;
    });
  }
  proctoResults.forEach((pr, i) => { if (pw[pr.playerId]) pw[pr.playerId].procto += (proctoPayouts[i] || 0); });
  Object.values(pw).forEach(p => { p.total = p.game + p.skins + p.procto; });

  // Copy-to-clipboard for email
  function copySnapshot() {
    const el = document.getElementById('snapshot-email');
    if (!el) return;
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    notify('Snapshot copied to clipboard \u2014 paste into email', 'success');
  }

  const $ = (v) => v > 0 ? `$${v.toFixed(2)}` : '';
  const fmtDate = new Date(cr.roundDate).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

  return h('div', { className: 'max-w-[1400px] mx-auto px-4 py-4 space-y-4' },
    // Action bar
    h('div', { className: 'flex justify-between items-center print:hidden' },
      h(Btn, { variant: 'secondary', onClick: () => setPage('results') }, '\u2190 Results'),
      h('div', { className: 'flex gap-2' },
        h(Btn, { variant: 'secondary', onClick: copySnapshot }, 'Copy for Email'),
        h(Btn, { onClick: () => window.print() }, 'Print / PDF'),
      ),
    ),

    // ═══ THE SNAPSHOT (email-able content) ═══
    h('div', { id: 'snapshot-email', style: { fontFamily: 'Arial, Helvetica, sans-serif', fontSize: '12px', color: '#1a2e33', background: '#fff', padding: '16px' } },

      // Header
      h('table', { style: { width: '100%', borderCollapse: 'collapse', marginBottom: '12px' } },
        h('tbody', null,
          h('tr', null,
            h('td', { style: { verticalAlign: 'middle' } },
              h('img', { src: LOGO_SRC, alt: 'The Blitz', style: { height: '60px' } }),
            ),
            h('td', { style: { textAlign: 'center', verticalAlign: 'middle' } },
              h('div', { style: { fontSize: '20px', fontWeight: '800', color: '#0c3640' } }, 'Daily Email Snapshot'),
            ),
            h('td', { style: { textAlign: 'right', verticalAlign: 'middle', fontSize: '11px', color: '#5a7a7e' } },
              h('div', null, fmtDate),
              h('div', null, `${cr.courseName}`),
              h('div', null, `${cr.gameFormat}`),
            ),
          ),
        ),
      ),

      // Round info bar
      h('table', { style: { width: '100%', borderCollapse: 'collapse', background: '#0c3640', color: '#fff', marginBottom: '8px', borderRadius: '6px', fontSize: '11px' } },
        h('tbody', null,
          h('tr', null,
            h('td', { style: { padding: '6px 12px' } }, h('b', null, 'RoundID: '), cr.roundId),
            h('td', { style: { padding: '6px 12px' } }, h('b', null, 'Players: '), presentCount),
            h('td', { style: { padding: '6px 12px' } }, h('b', null, 'Teams: '), teamNos.length),
            h('td', { style: { padding: '6px 12px' } }, h('b', null, 'Game: '), `$${cr.gameFee}`),
            h('td', { style: { padding: '6px 12px' } }, h('b', null, 'Skins: '), `$${cr.skinsFee}`),
            h('td', { style: { padding: '6px 12px' } }, h('b', null, 'Procto: '), `$${cr.proctoFee}`),
            h('td', { style: { padding: '6px 12px', fontWeight: '700' } }, `Total Pool: $${totalPool.toFixed(2)}`),
          ),
        ),
      ),

      // ═══ MASTER PLAYER TABLE (matches the Excel Daily Email Snapshot) ═══
      h('div', { style: { overflowX: 'auto', marginBottom: '12px' } },
        h('table', { style: { width: '100%', borderCollapse: 'collapse', fontSize: '11px' }, cellPadding: '3' },
          h('thead', null,
            // Group headers
            h('tr', { style: { background: '#0c3640', color: '#fff', fontWeight: '700', fontSize: '10px' } },
              h('th', { colSpan: 3, style: { padding: '4px 6px', textAlign: 'left', borderRight: '2px solid #fff' } }, 'Players'),
              h('th', { colSpan: 18, style: { padding: '4px 6px', textAlign: 'center', borderRight: '2px solid #fff' } }, 'Holes'),
              h('th', { colSpan: 3, style: { padding: '4px 6px', textAlign: 'center', borderRight: '2px solid #fff' } }, 'Totals'),
              h('th', { colSpan: 3, style: { padding: '4px 6px', textAlign: 'center', borderRight: '2px solid #fff' } }, 'Game Score'),
              h('th', { colSpan: 2, style: { padding: '4px 6px', textAlign: 'center', borderRight: '2px solid #fff' } }, 'Skins'),
              h('th', { colSpan: 3, style: { padding: '4px 6px', textAlign: 'center', borderRight: '2px solid #fff' } }, 'Buy-In'),
              h('th', { colSpan: 4, style: { padding: '4px 6px', textAlign: 'center' } }, 'Total Winnings'),
            ),
            // Column headers
            h('tr', { style: { background: '#e4e9e7', fontWeight: '700', fontSize: '10px', borderBottom: '2px solid #0c3640' } },
              h('th', { style: { textAlign: 'left', padding: '3px 6px' } }, 'Player'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px' } }, 'Tm'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px', borderRight: '2px solid #ccc' } }, 'Hcp'),
              ...Array.from({ length: 18 }, (_, i) => h('th', { key: i, style: { textAlign: 'center', padding: '3px 2px', minWidth: '22px', borderRight: i === 8 ? '2px solid #ccc' : '' } }, i + 1)),
              h('th', { style: { textAlign: 'center', padding: '3px 4px', borderLeft: '2px solid #ccc' } }, 'Front'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px' } }, 'Back'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px', fontWeight: '800', borderRight: '2px solid #ccc' } }, 'Total'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px' } }, 'Front'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px' } }, 'Back'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px', borderRight: '2px solid #ccc' } }, 'Total'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px' } }, 'Net'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px', borderRight: '2px solid #ccc' } }, 'Gross'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px' } }, 'Game'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px' } }, 'Skins'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px', borderRight: '2px solid #ccc' } }, 'Procto'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px' } }, 'Game$'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px' } }, 'Skins$'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px' } }, 'Procto$'),
              h('th', { style: { textAlign: 'center', padding: '3px 4px', fontWeight: '800', color: '#1a8a68' } }, 'Per Win$'),
            ),
          ),
          h('tbody', null,
            // Par row
            h('tr', { style: { background: '#f4f7f6', color: '#5a7a7e', fontSize: '10px' } },
              h('td', { style: { padding: '2px 6px' } }, 'Par'),
              h('td'), h('td', { style: { borderRight: '2px solid #ccc' } }),
              ...Array.from({ length: 18 }, (_, i) => { const ho = holes.find(h => h.holeNumber === i + 1); return h('td', { key: i, style: { textAlign: 'center', borderRight: i === 8 ? '2px solid #ccc' : '' } }, ho?.par || ''); }),
              h('td', { style: { textAlign: 'center', borderLeft: '2px solid #ccc', fontWeight: '600' } }, holes.filter(h => h.holeNumber <= 9).reduce((s, h) => s + h.par, 0)),
              h('td', { style: { textAlign: 'center', fontWeight: '600' } }, holes.filter(h => h.holeNumber > 9).reduce((s, h) => s + h.par, 0)),
              h('td', { style: { textAlign: 'center', fontWeight: '700', borderRight: '2px solid #ccc' } }, holes.reduce((s, h) => s + h.par, 0)),
              h('td', { colSpan: 11 }),
            ),
            // Player rows
            ...cr.participants.filter(p => p.present).sort((a, b) => (a.teamNo || 99) - (b.teamNo || 99) || a.playerName.localeCompare(b.playerName)).map((p, ri) => {
              const pid = p.drawnFromPlayerId || p.playerId;
              let front = 0, back = 0, fc = 0, bc = 0;
              const holeVals = Array.from({ length: 18 }, (_, i) => {
                const sc = cr.scores.find(s => s.playerId === pid && s.holeNo === i + 1);
                if (sc) { if (i < 9) { front += sc.gross; fc++; } else { back += sc.gross; bc++; } return sc.gross; }
                return null;
              });
              const total = fc + bc === 18 ? front + back : null;
              // Game score (net contribution to team)
              let gFront = 0, gBack = 0;
              for (let hno = 1; hno <= 18; hno++) {
                const sc = cr.scores.find(s => s.playerId === pid && s.holeNo === hno);
                if (!sc) continue;
                const hole = holes.find(h => h.holeNumber === hno);
                if (!hole) continue;
                const strokes = strokeCache[pid] || {};
                const net = sc.gross - (strokes[hno] || 0);
                const basis = (fmt?.scoreBasis === 'GROSS') ? sc.gross - hole.par : net - hole.par;
                if (hno <= 9) gFront += basis; else gBack += basis;
              }
              // Skins won by this player
              let netSkins = 0, grossSkins = 0;
              Object.values(skinsMap).forEach(s => {
                if (s.grossWinner?.playerId === p.playerId) grossSkins++;
                if (s.netWinner?.playerId === p.playerId) netSkins++;
              });
              const pWin = pw[p.playerId] || { game: 0, skins: 0, procto: 0, total: 0 };
              const rowBg = ri % 2 === 0 ? '#fff' : '#f9fbfa';
              const winBg = pWin.total > 0 ? '#e6f5ef' : rowBg;

              return h('tr', { key: p.playerId, style: { background: rowBg, borderBottom: '1px solid #e4e9e7' } },
                h('td', { style: { padding: '3px 6px', fontWeight: '600', whiteSpace: 'nowrap', maxWidth: '120px', overflow: 'hidden', textOverflow: 'ellipsis' } }, p.playerName),
                h('td', { style: { textAlign: 'center' } }, p.teamNo || ''),
                h('td', { style: { textAlign: 'center', borderRight: '2px solid #ccc' } }, p.courseHandicap ?? ''),
                ...holeVals.map((v, i) => h('td', { key: i, style: { textAlign: 'center', fontFamily: 'monospace', fontSize: '11px', borderRight: i === 8 ? '2px solid #ccc' : '' } }, v ?? '')),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace', fontWeight: '600', borderLeft: '2px solid #ccc' } }, fc === 9 ? front : ''),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace', fontWeight: '600' } }, bc === 9 ? back : ''),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace', fontWeight: '800', borderRight: '2px solid #ccc' } }, total ?? ''),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace' } }, gFront.toFixed(1)),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace' } }, gBack.toFixed(1)),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace', fontWeight: '600', borderRight: '2px solid #ccc' } }, (gFront + gBack).toFixed(1)),
                h('td', { style: { textAlign: 'center' } }, netSkins || ''),
                h('td', { style: { textAlign: 'center', borderRight: '2px solid #ccc' } }, grossSkins || ''),
                h('td', { style: { textAlign: 'center' } }, `$${cr.gameFee}`),
                h('td', { style: { textAlign: 'center' } }, `$${cr.skinsFee}`),
                h('td', { style: { textAlign: 'center', borderRight: '2px solid #ccc' } }, `$${cr.proctoFee}`),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace', background: pWin.game > 0 ? '#e6f5ef' : '' } }, $(pWin.game)),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace', background: pWin.skins > 0 ? '#e6f5ef' : '' } }, $(pWin.skins)),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace', background: pWin.procto > 0 ? '#e6f5ef' : '' } }, $(pWin.procto)),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace', fontWeight: '800', color: pWin.total > 0 ? '#1a8a68' : '', background: winBg } }, $(pWin.total)),
              );
            }),
          ),
        ),
      ),

      // ═══ SKINS DETAIL TABLE ═══
      h('div', { style: { marginTop: '12px', marginBottom: '12px' } },
        h('div', { style: { fontWeight: '800', fontSize: '13px', marginBottom: '4px', color: '#0c3640' } }, `Skins Detail \u2014 $${skinsPayout.perSkin}/skin (${totalSkinsWon} won, $${skinsPayout.kitty} kitty)`),
        h('table', { style: { width: '100%', borderCollapse: 'collapse', fontSize: '11px' }, cellPadding: '3' },
          h('thead', null,
            h('tr', { style: { background: '#e4e9e7', fontWeight: '700', fontSize: '10px', borderBottom: '2px solid #0c3640' } },
              h('th', { style: { textAlign: 'center', padding: '3px 6px' } }, 'Hole'),
              h('th', { style: { textAlign: 'center' } }, 'Par'),
              h('th', { style: { textAlign: 'left', padding: '3px 8px' } }, 'Gross Skin Winner'),
              h('th', { style: { textAlign: 'center' } }, 'Score'),
              h('th', { style: { textAlign: 'left', padding: '3px 8px' } }, 'Net Skin Winner'),
              h('th', { style: { textAlign: 'center' } }, 'Score'),
            ),
          ),
          h('tbody', null,
            Array.from({ length: 18 }, (_, i) => {
              const hno = i + 1;
              const hole = holes.find(h => h.holeNumber === hno);
              const s = skinsMap[hno] || {};
              return h('tr', { key: hno, style: { borderBottom: '1px solid #e4e9e7', background: (s.grossWinner || s.netWinner) ? '#fffde6' : '' } },
                h('td', { style: { textAlign: 'center', fontWeight: '600' } }, hno),
                h('td', { style: { textAlign: 'center', color: '#5a7a7e' } }, hole?.par),
                h('td', { style: { padding: '3px 8px', fontWeight: s.grossWinner ? '600' : '400', color: s.grossWinner ? '#1a2e33' : '#97b0b4' } }, s.grossWinner?.playerName || '\u2014'),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace' } }, s.grossWinner?.gross || ''),
                h('td', { style: { padding: '3px 8px', fontWeight: s.netWinner ? '600' : '400', color: s.netWinner ? '#1a2e33' : '#97b0b4' } }, s.netWinner?.playerName || '\u2014'),
                h('td', { style: { textAlign: 'center', fontFamily: 'monospace' } }, s.netWinner?.net || ''),
              );
            }),
          ),
        ),
      ),

      // ═══ PROCTOS + TEAM STANDINGS SIDE BY SIDE ═══
      h('table', { style: { width: '100%' } },
        h('tbody', null,
          h('tr', { style: { verticalAlign: 'top' } },
            // Proctos
            h('td', { style: { width: '40%', paddingRight: '12px' } },
              h('div', { style: { fontWeight: '800', fontSize: '13px', marginBottom: '4px', color: '#0c3640' } }, `Proctos \u2014 $${proctoPool.toFixed(2)} pool`),
              h('table', { style: { width: '100%', borderCollapse: 'collapse', fontSize: '11px' }, cellPadding: '3' },
                h('thead', null,
                  h('tr', { style: { background: '#e4e9e7', fontWeight: '700', fontSize: '10px', borderBottom: '2px solid #0c3640' } },
                    h('th', { style: { textAlign: 'center' } }, 'Hole'),
                    h('th', { style: { textAlign: 'left', padding: '3px 8px' } }, 'Winner'),
                    h('th', { style: { textAlign: 'center' } }, 'Payout'),
                  ),
                ),
                h('tbody', null,
                  par3Holes.map((hole, i) => {
                    const pr = proctoResults.find(r => r.holeNo === hole.holeNumber);
                    return h('tr', { key: hole.holeNumber, style: { borderBottom: '1px solid #e4e9e7' } },
                      h('td', { style: { textAlign: 'center', fontWeight: '600' } }, hole.holeNumber),

            ),
            // Team standings
            h('td', { style: { width: '60%', paddingLeft: '12px' } },
              h('div', { style: { fontWeight: '800', fontSize: '13px', marginBottom: '4px', color: '#0c3640' } }, `Team Standings \u2014 $${gamePool.toFixed(2)} pool (${payoutMode === 'TOP3_TOTAL' ? 'Total Only' : 'Front/Back/Total'})`),
              h('table', { style: { width: '100%', borderCollapse: 'collapse', fontSize: '11px' }, cellPadding: '3' },
                h('thead', null,
                  h('tr', { style: { background: '#e4e9e7', fontWeight: '700', fontSize: '10px', borderBottom: '2px solid #0c3640' } },

function HistoryPage() {
  const { state, setPage } = useApp();
  const archives = (state.roundArchives || []).sort((a, b) => new Date(b.roundDate) - new Date(a.roundDate));
  const [expanded, setExpanded] = useState(null);

  return h('div', { className: 'max-w-[1400px] mx-auto px-6 py-4 space-y-4' },
    h('div', { className: 'text-sm text-txt-m' }, `${archives.length} finalized round${archives.length !== 1 ? 's' : ''}`),

    archives.length === 0
      ? h(Card, { className: 'text-center py-8 text-txt-m' }, 'No finalized rounds yet')
      : archives.map((ar, i) => h(Card, {
          key: i,
          className: 'cursor-pointer hover:border-acc transition-colors',
        },
          h('div', { onClick: () => setExpanded(expanded === i ? null : i) },
            h('div', { className: 'flex justify-between items-center' },
              h('div', null,
                h('div', { className: 'font-medium text-sm' }, `${ar.courseName} \u2014 ${ar.gameFormat}`),
                h('div', { className: 'text-xs text-txt-m' },
                  new Date(ar.roundDate).toLocaleDateString(),
                  ` \u2022 ${ar.participants?.filter(p => p.present).length || 0} players`,
                  ` \u2022 ${ar.teams?.length || 0} teams`,
                ),
              ),
              h('span', { className: 'text-xs text-acc' }, expanded === i ? '\u25B2' : '\u25BC'),
            ),
          ),
          expanded === i && h('div', { className: 'mt-3 pt-3 border-t border-bdr space-y-2' },
            // Team results
            ar.teams?.map(t => {
              const members = ar.participants?.filter(p => p.teamNo === t.teamNo) || [];
              return h('div', { key: t.teamNo, className: 'text-sm' },
                h('span', { className: 'font-medium' }, `Team ${t.teamNo}: `),
                members.map(m => m.playerName?.split(',')[0]).join(', '),
              );
            }),
            h('div', { className: 'text-xs text-txt-m mt-2' },
              `Archived ${ar.archivedHandicapCount || 0} scores`,
              ar.skippedIncompleteCount > 0 && `, skipped ${ar.skippedIncompleteCount} incomplete`,
              ar.finalizedAt && ` \u2022 Finalized ${new Date(ar.finalizedAt).toLocaleString()}`,
            ),
          ),
        )),

    h(Btn, { variant: 'ghost', onClick: () => setPage('dashboard') }, '\u2190 Dashboard'),
  );
}


// ═══════════════════════════════════════════════════════════════════
// GOOGLE DRIVE PERSISTENCE MODULE
// ═══════════════════════════════════════════════════════════════════

const GoogleDrive = (() => {
  // Pure fetch()-based Drive API — redirect auth (no popup, no COOP issue)
  const SCOPES = 'https://www.googleapis.com/auth/drive.file';
  const AUTH_URL = 'https://accounts.google.com/o/oauth2/v2/auth';
  const API = 'https://www.googleapis.com/drive/v3';
  const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
  const FOLDER_NAME = 'Blitz Golf';
  const STATE_FILE = 'blitz-state.json';
  let _token = null;
  let _folderId = null;
  let _stateFileId = null;
  let _lastModified = null;

  // — Check URL hash for token on page load (redirect callback) —
  function checkRedirectToken() {
    const hash = window.location.hash;
    if (!hash || !hash.includes('access_token')) return false;
    const params = new URLSearchParams(hash.substring(1));
    const token = params.get('access_token');
    const expiresIn = parseInt(params.get('expires_in') || '3600');
    if (token) {
      _token = token;
      // Store token and expiry in sessionStorage
      sessionStorage.setItem('blitz_drive_token', token);
      sessionStorage.setItem('blitz_drive_expires', (Date.now() + expiresIn * 1000).toString());
      // Clean the URL hash so it doesn't linger
      history.replaceState(null, '', window.location.pathname + window.location.search);
      return true;
    }
    return false;
  }

  // — Restore token from sessionStorage if still valid —
  function restoreToken() {
    const token = sessionStorage.getItem('blitz_drive_token');
    const expires = parseInt(sessionStorage.getItem('blitz_drive_expires') || '0');
    if (token && Date.now() < expires) {
      _token = token;
      return true;
    }
    return false;
  }

  // — Start OAuth redirect (same tab, no popup) —
  function startAuth(clientId) {
    // Build the redirect URI from the current page URL (without hash/query)
    const redirectUri = window.location.origin + window.location.pathname;
    // Save a flag so we know to auto-sync after redirect
    sessionStorage.setItem('blitz_drive_pending_sync', 'true');
    const params = new URLSearchParams({
      client_id: clientId,
      redirect_uri: redirectUri,
      response_type: 'token',
      scope: SCOPES,
      include_granted_scopes: 'true',
      prompt: 'consent',
    });
    window.location.href = `${AUTH_URL}?${params.toString()}`;
  }

  // — Init: check for existing token or start redirect —
  async function init(clientId) {
    // First check if we just came back from a redirect
    if (checkRedirectToken()) return true;
    // Check sessionStorage for a valid token
    if (restoreToken()) return true;
    // No token — start the redirect flow
    startAuth(clientId);
    // This line won't execute (page is navigating away)
    return false;
  }

  // — Helpers —
  function headers() {
    if (!_token) throw new Error('Not authenticated. Click Connect & Sync first.');
    return { 'Authorization': `Bearer ${_token}`, 'Content-Type': 'application/json' };
  }

  async function driveGet(url) {
    const r = await fetch(url, { headers: headers() });
    if (!r.ok) {
      const body = await r.text();
      throw new Error(`Drive GET ${r.status}: ${body.slice(0, 200)}`);
    }
    return r.json();
  }

  async function drivePost(url, body, extraHeaders) {
    const h = { ...headers(), ...extraHeaders };
    const r = await fetch(url, { method: 'POST', headers: h, body: typeof body === 'string' ? body : JSON.stringify(body) });
    if (!r.ok) {
      const text = await r.text();
      throw new Error(`Drive POST ${r.status}: ${text.slice(0, 200)}`);
    }
    return r.json();
  }

  async function drivePatch(url, body, extraHeaders) {
    const h = { ...headers(), ...extraHeaders };
    const r = await fetch(url, { method: 'PATCH', headers: h, body: typeof body === 'string' ? body : JSON.stringify(body) });
    if (!r.ok) {
      const text = await r.text();
      throw new Error(`Drive PATCH ${r.status}: ${text.slice(0, 200)}`);
    }
    return r.json();
  }

  // — Folder management —
  async function findOrCreateFolder(name, parentId) {
    const q = parentId
      ? `name='${name}' and '${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`
      : `name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const list = await driveGet(`${API}/files?q=${encodeURIComponent(q)}&fields=files(id,name)&spaces=drive`);
    if (list.files && list.files.length > 0) return list.files[0].id;
    const meta = { name, mimeType: 'application/vnd.google-apps.folder' };
    if (parentId) meta.parents = [parentId];
    const created = await drivePost(`${API}/files?fields=id`, meta);
    return created.id;
  }

  async function ensureFolder() {
    if (_folderId) return _folderId;
    _folderId = await findOrCreateFolder(FOLDER_NAME, null);
    return _folderId;
  }

  async function ensureSubFolder(name) {
    const parentId = await ensureFolder();
    return findOrCreateFolder(name, parentId);
  }

  // — File operations using multipart upload —
  async function createFile(name, parentId, jsonString) {
    const metadata = JSON.stringify({ name, parents: [parentId] });
    const boundary = '---blitz' + Date.now();
    const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${jsonString}\r\n--${boundary}--`;
    const result = await drivePost(
      `${UPLOAD}/files?uploadType=multipart&fields=id,modifiedTime`,
      body,
      { 'Content-Type': `multipart/related; boundary=${boundary}` }
    );
    return result;
  }

  async function updateFile(fileId, jsonString) {
    const r = await fetch(`${UPLOAD}/files/${fileId}?uploadType=media&fields=id,modifiedTime`, {
      method: 'PATCH',
      headers: { 'Authorization': `Bearer ${_token}`, 'Content-Type': 'application/json' },
      body: jsonString,
    });
    if (!r.ok) {
      const text = await r.text();
      throw new Error(`Drive update ${r.status}: ${text.slice(0, 200)}`);
    }
    return r.json();
  }

  async function findFile(name, parentId) {
    const q = `name='${name}' and '${parentId}' in parents and trashed=false`;
    const list = await driveGet(`${API}/files?q=${encodeURIComponent(q)}&fields=files(id,modifiedTime)&spaces=drive`);
    return (list.files && list.files.length > 0) ? list.files[0] : null;
  }

  async function downloadFile(fileId) {
    const r = await fetch(`${API}/files/${fileId}?alt=media`, { headers: { 'Authorization': `Bearer ${_token}` } });
    if (!r.ok) throw new Error(`Drive download ${r.status}`);
    return r.json();
  }

  // — Public API —
  async function saveState(stateObj) {
    const folderId = await ensureFolder();
    const json = JSON.stringify(stateObj);

    if (_stateFileId) {
      // Conflict check
      const meta = await driveGet(`${API}/files/${_stateFileId}?fields=modifiedTime`);
      if (_lastModified && meta.modifiedTime !== _lastModified) {
        throw new Error('CONFLICT: File was modified by another session. Reload to resolve.');
      }
      const result = await updateFile(_stateFileId, json);
      _lastModified = result.modifiedTime;
    } else {
      const existing = await findFile(STATE_FILE, folderId);
      if (existing) {
        _stateFileId = existing.id;
        _lastModified = existing.modifiedTime;
        const result = await updateFile(_stateFileId, json);
        _lastModified = result.modifiedTime;
      } else {
        const result = await createFile(STATE_FILE, folderId, json);
        _stateFileId = result.id;
        _lastModified = result.modifiedTime;
      }
    }
    return { fileId: _stateFileId, modifiedTime: _lastModified };
  }

  async function loadState() {
    const folderId = await ensureFolder();
    const existing = await findFile(STATE_FILE, folderId);
    if (!existing) return null;
    _stateFileId = existing.id;
    _lastModified = existing.modifiedTime;
    return downloadFile(_stateFileId);
  }

  async function saveArchive(roundData, filename) {
    const archiveId = await ensureSubFolder('archives');
    await createFile(filename, archiveId, JSON.stringify(roundData));
  }

  async function saveBackup(stateObj, filename) {
    const backupId = await ensureSubFolder('backups');
    await createFile(filename, backupId, JSON.stringify(stateObj));
  }

  function isConnected() { return !!_token; }

  return { init, checkRedirectToken, restoreToken, saveState, loadState, saveArchive, saveBackup, ensureFolder, isConnected };
})();
